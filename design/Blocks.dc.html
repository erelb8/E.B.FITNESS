<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #E7B873; } a:hover { color: #D19A55; }
  </style>
</helmet>

<div dir="rtl" style="width:390px;min-height:1160px;background:#120E0A;font-family:Heebo,system-ui,sans-serif;color:#F2E8D8;padding:16px 14px 34px;display:flex;flex-direction:column;gap:10px">

  <!-- ראש -->
  <div style="display:flex;align-items:center;gap:10px;padding:4px 4px 10px">
    <div style="flex-grow:1">
      <div style="font-size:22px;font-weight:900;line-height:1.1">דני כהן</div>
      <div style="font-size:11.5px;color:#8A7A66;margin-top:2px">שבוע 7 · חיטוב</div>
    </div>
    <div style="background:#E7B873;color:#120E0A;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:900">רצף 12</div>
  </div>

  <!-- הבלוק הראשי -->
  <div style="background:#8FA84F;color:#121009;border-radius:20px;padding:22px;position:relative;overflow:hidden">
    <div style="position:absolute;inset-block-start:-46px;inset-inline-start:-46px;width:170px;height:170px;border-radius:50%;background:rgba(18,16,9,.08)"></div>
    <div style="position:relative">
      <div style="font-size:12px;font-weight:800;letter-spacing:.1em;opacity:.7">היום · אימון A</div>
      <div style="font-size:31px;font-weight:900;line-height:1.1;margin:7px 0 3px">פלג גוף עליון</div>
      <div style="font-size:13px;opacity:.75;margin-bottom:16px">6 תרגילים · 55 דקות</div>
      <div style="display:flex;align-items:center;gap:9px;background:#121009;color:#F2E8D8;border-radius:11px;padding:13px 16px">
        <span style="flex-grow:1;font-size:15px;font-weight:800">בוא נתחיל</span>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8FA84F" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </div>
    </div>
  </div>

  <!-- שני בלוקים -->
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
    <div style="background:#D19A55;color:#1A1209;border-radius:18px;padding:17px;min-height:124px;display:flex;flex-direction:column">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1A1209" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M21 7v5h-5"/></svg>
      <div style="flex-grow:1"></div>
      <div style="font-size:30px;font-weight:900;line-height:1">−1.9</div>
      <div style="font-size:11.5px;font-weight:700;opacity:.7">ק״ג החודש</div>
    </div>
    <div style="background:#2E2419;border:1px solid #46362A;border-radius:18px;padding:17px;min-height:124px;display:flex;flex-direction:column">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E7B873" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4"/><path d="M17 4H7v6a5 5 0 0 0 10 0V4Z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <div style="flex-grow:1"></div>
      <div style="font-size:30px;font-weight:900;line-height:1;color:#E7B873">7</div>
      <div style="font-size:11.5px;font-weight:700;color:#8A7A66">שיאים אישיים</div>
    </div>
  </div>

  <!-- המאמן החכם -->
  <div style="background:#2E2419;border-radius:18px;padding:17px;border-inline-start:5px solid #8FA84F">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px">
      <span style="width:8px;height:8px;border-radius:50%;background:#8FA84F"></span>
      <span style="font-size:12px;font-weight:800;letter-spacing:.05em;color:#8FA84F">המאמן החכם</span>
    </div>
    <div style="font-size:17px;font-weight:900;line-height:1.3;margin-bottom:5px">שיא חדש בלחיצת חזה</div>
    <div style="font-size:12.5px;line-height:1.65;color:#B5A691">62.5 ק״ג לשמונה חזרות. עלית 14 אחוז בשישה שבועות — תמשיך בדיוק ככה.</div>
  </div>

  <!-- הרגלים -->
  <div style="background:#2E2419;border:1px solid #46362A;border-radius:18px;padding:17px">
    <div style="display:flex;align-items:baseline;margin-bottom:13px">
      <div style="flex-grow:1;font-size:14px;font-weight:900">הרגלים היום</div>
      <div style="font-size:12px;font-weight:800;color:#8FA84F">2/3</div>
    </div>
    <div style="display:flex;gap:9px">
      <div style="flex-grow:1;background:#8FA84F;color:#121009;border-radius:12px;padding:12px 8px;text-align:center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#121009" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.7S6 9 6 13.5a6 6 0 0 0 12 0C18 9 12 2.7 12 2.7Z"/></svg>
        <div style="font-size:11px;font-weight:800;margin-top:5px">מים</div>
      </div>
      <div style="flex-grow:1;background:#8FA84F;color:#121009;border-radius:12px;padding:12px 8px;text-align:center">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#121009" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <div style="font-size:11px;font-weight:800;margin-top:5px">שינה</div>
      </div>
      <div style="flex-grow:1;background:#241C13;border:1.5px dashed #5A4735;border-radius:12px;padding:12px 8px;text-align:center;color:#8A7A66">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8A7A66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4l7-7-4-4-7 7v4Z"/><path d="M13 6l3-3 5 5-3 3"/></svg>
        <div style="font-size:11px;font-weight:800;margin-top:5px">צעדים</div>
      </div>
    </div>
  </div>

  <!-- תמונות התקדמות -->
  <div style="background:#2E2419;border:1px solid #46362A;border-radius:18px;padding:17px">
    <div style="display:flex;align-items:baseline;margin-bottom:12px">
      <div style="flex-grow:1;font-size:14px;font-weight:900">תמונות התקדמות</div>
      <div style="font-size:11.5px;color:#8A7A66">3 מדידות</div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <div style="aspect-ratio:3/4;border-radius:11px;background:linear-gradient(150deg,#46362A,#2A2118);display:flex;align-items:flex-end;padding:7px"><span style="font-size:10px;color:#8A7A66;font-weight:700">שבוע 1</span></div>
      <div style="aspect-ratio:3/4;border-radius:11px;background:linear-gradient(150deg,#46362A,#2A2118);display:flex;align-items:flex-end;padding:7px"><span style="font-size:10px;color:#8A7A66;font-weight:700">שבוע 4</span></div>
      <div style="aspect-ratio:3/4;border-radius:11px;border:1.5px dashed #5A4735;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#D19A55" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span style="font-size:9.5px;color:#D19A55;font-weight:800">היום</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
