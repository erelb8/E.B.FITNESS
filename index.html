/* --------- הפעלת כניסה לכל המתאמנים בבת אחת --------- */
/* תעתיק עברית->אנגלית לשם משתמש. לא מדויק בלשנית, ומספיק כדי לייצר
   שם קריא שהמאמן יכול לשנות. */
const HEB2EN = {'א':'a','ב':'b','ג':'g','ד':'d','ה':'h','ו':'v','ז':'z','ח':'ch','ט':'t',
  'י':'y','כ':'k','ך':'k','ל':'l','מ':'m','ם':'m','נ':'n','ן':'n','ס':'s','ע':'a',
  'פ':'p','ף':'f','צ':'tz','ץ':'tz','ק':'k','ר':'r','ש':'sh','ת':'t','׳':'','"':'',"'":''};

function slugName(name){
  /* ו׳ וי׳ הן גם עיצורים וגם תנועות. בתחילת מילה הן עיצור (v/y),
     ובאמצע תנועה (o/i) — בלי ההבחנה "אור שריקי" הופך ל-avr.shryky,
     שם משתמש שאף מתאמן לא יצליח להקליד. */
  const word = w => {
    const ch = w.split('');
    return ch.map((c, i) => {
      if (c === 'ו') return i === 0 ? 'v' : 'o';
      if (c === 'י') return i === 0 ? 'y' : 'i';
      // א פותחת שנשמעת דרך התנועה שאחריה — מושמטת
      if (c === 'א' && i === 0 && (ch[1] === 'ו' || ch[1] === 'י')) return '';
      return HEB2EN[c] !== undefined ? HEB2EN[c] : (/[a-z0-9]/i.test(c) ? c.toLowerCase() : '');
    }).join('');
  };
  let s = String(name||'').trim().split(/\s+/).map(word).filter(Boolean).join('.');
  s = s.replace(/[^a-z0-9._-]/g,'').replace(/\.+/g,'.').replace(/^\.|\.$/g,'');
  return s.slice(0,20) || 'user';
}
/* סיסמה קריאה: בלי תווים שמתבלבלים ביניהם (0/O, 1/l/I) */
function genPass(){
  const A='abcdefghjkmnpqrstuvwxyz', N='23456789';
  let p=''; for(let i=0;i<4;i++) p+=A[Math.floor(Math.random()*A.length)];
  for(let i=0;i<4;i++) p+=N[Math.floor(Math.random()*N.length)];
  return p;
}

async function bulkLogins(){
  if(!window.EBSync || !EBSync.enabled() || !EBSync.user()){ toast('צריך להתחבר לסנכרון קודם'); return; }
  const list = activeTrainees();
  if(!list.length){ toast('אין מתאמנים'); return; }

  /* מתאמן שיובא זה עתה קיים רק במכשיר. set_trainee_login מחפש אותו
     בשרת ונכשל ב"not your trainee" — כלומר ייבוא ואז הפעלת כניסה מיד
     אחריו היה נכשל לכולם. מסנכרנים קודם וממתינים. */
  if(navigator.onLine){
    toast('מסנכרן לפני ההגדרה…');
    try{ await EBSync.run(); }catch(e){}
    const unsynced = list.filter(t=>!t._token);
    if(unsynced.length){
      toast('הסנכרון לא הושלם — נסה שוב בעוד רגע');
      return;
    }
  }

  const withLogin = list.filter(t=>t._username).length;
  if(!confirm('להפעיל כניסה ל-'+list.length+' מתאמנים?\n\n'
    + (withLogin? withLogin+' כבר עם שם משתמש — להם תיווצר סיסמה חדשה.\n\n' : '')
    + 'הסיסמאות יוצגו פעם אחת בלבד — אחר כך הן מוצפנות ולא ניתנות לשחזור.')) return;

  const taken = new Set(S.trainees.map(t=>(t._username||'').toLowerCase()).filter(Boolean));
  const done = [], failed = [];

  for(const t of list){
    let u = t._username || slugName(t.name);
    if(!t._username){
      let base=u, n=2;
      while(taken.has(u)){ u = base+n; n++; }
    }
    taken.add(u);
    const p = genPass();
    toast('מגדיר ל'+t.name+'…');
    try{ await EBSync.setLogin(t.id, u, p); done.push({t, u, p}); }
    catch(e){ failed.push({name:t.name, err:(e&&e.message)||'שגיאה'}); }
  }
  rawSave();
  showLogins(done, failed);
}

function showLogins(done, failed){

  let h = '<div class="mh"><h3>פרטי הכניסה</h3><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="mb">'
    + '<p style="font-size:13px;margin:0 0 12px;color:var(--warn)">'
    + 'זו הפעם היחידה שהסיסמאות מוצגות. העתק אותן עכשיו — אחר כך אפשר רק לאפס.</p>';

  if(done.length){

    done.forEach(d=>{
      h += '<div class="line-item" style="align-items:center">'
        + '<span style="flex:1;font-size:14px">'+esc(d.t.name)+'</span>'
        + '<code style="font-size:12.5px;color:var(--or);direction:ltr">'+esc(d.u)+'</code>'
        + '<code style="font-size:12.5px;direction:ltr;min-width:82px">'+esc(d.p)+'</code>'

        + '</div>';
    });

  }
  if(failed.length){
    h += '<div class="sep"></div><div class="muted" style="font-size:13px;color:var(--bad)">נכשלו: '
      + failed.map(f=>esc(f.name)+' ('+esc(f.err)+')').join(' · ') + '</div>';
  }

  const txt = 'כתובת הכניסה: '+base+'\n\n'
    + done.map(d=>d.t.name+'\nשם משתמש: '+d.u+'\nסיסמה: '+d.p).join('\n\n');

  window.__logins = txt;
  openModal(h, true);
}

}

  let ph=(t.phone||'').replace(/\D/g,''); if(ph.startsWith('0')) ph='972'+ph.slice(1);

async function clearTraineeLogin(id){
  const t=tById(id); if(!t) return;
  if(!confirm('לבטל את הכניסה של '+t.name+'? הוא לא יוכל להיכנס עם שם משתמש, אבל הקישור האישי ימשיך לעבוד.')) return;
  try{ await EBSync.setLogin(id,'',''); rawSave(); render(); toast('הכניסה בוטלה'); }
  catch(e){ toast((e&&e.message)||'לא הצלחנו לבטל'); }
}

function sendLoginDetails(id){
  const t=tById(id); if(!t||!t._username) return;
  const base=location.href.replace(/[^/]*$/,'')+'t.html';
  const msg='היי '+t.name+'! 💪\n\nהכניסה לתוכנית שלך:\n'+base
    +'\n\nשם משתמש: '+t._username
    +'\nסיסמה: (הסיסמה שקבענו)\n\n'
    +'שם תראה את התוכנית, היעדים והקבצים שלך, ותוכל לסמן מה ביצעת.';
  let ph=(t.phone||'').replace(/\D/g,''); if(ph.startsWith('0')) ph='972'+ph.slice(1);
  window.open('https://wa.me/'+ph+'?text='+encodeURIComponent(msg),'_blank');
}

async function toggleAccess(id,active){
  if(!active && !confirm('לבטל את הגישה של המתאמן לקישור?')) return;
  try{ await EBSync.setAccess(id,active); rawSave(); render();
       toast(active?'הגישה הוחזרה':'הגישה בוטלה'); }
  catch(e){ toast('לא הצלחנו לעדכן'); }
}

/* --------- זיהוי מודול ישן ותיקון עצמי ---------
   index.html נטען תמיד מהרשת, אבל קבצי הצד עלולים להישאר במטמון של
   גרסה קודמת — וזה מתבטא בפיצ׳ר שנראה שבור בלי שום הודעה. כל מודול
   נושא חותמת גרסה; אם היא לא תואמת, מנקים ומרעננים פעם אחת בלבד. */
(function(){
  const need = ['files','intake','builder','import','sync','tracking'];
  const got  = window.EB_MOD || {};
  const bad  = need.filter(k => got[k] !== EB_VERSION);
  if(!bad.length) return;

  console.warn('[EB] מודולים ישנים במטמון:', bad.map(k=>k+'='+(got[k]||'חסר')).join(', '), 'צפוי', EB_VERSION);

  // מרעננים פעם אחת בלבד, כדי שלא ניכנס ללולאת טעינה
  let tried = false;
  try { tried = sessionStorage.getItem('eb_selfheal') === EB_VERSION; } catch(e){}
  if(tried){
    setTimeout(()=>toast('חלק מהקבצים ישנים — לחץ "רענון מלא" בהגדרות'), 1500);
    return;
  }
  try { sessionStorage.setItem('eb_selfheal', EB_VERSION); } catch(e){}
  setTimeout(()=>{ if(typeof forceUpdate==='function') forceUpdate(); }, 300);
})();

/* --------- הפעלה --------- */
if(window.EBSync){ EBSync.init(); EBSync.paint(); }
</script>
