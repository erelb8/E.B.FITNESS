<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>התוכנית שלי</title>

<!-- הדף הזה מכוון למתאמן. בכוונה אין כאן link למניפסט של המאמן,
     כדי שהוספה למסך הבית תיצור אצלו קיצור לתוכנית שלו ולא לאפליקציית הניהול. -->
<meta name="theme-color" content="#221A12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="התוכנית שלי">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* זהה לאפליקציית הניהול, כדי שהמתאמן יראה אותו מותג */
  --ink:#221A12; --card:#34281E; --line:#48392B; --line2:#5F4C39;
  --tx:#F2E8D8; --mut:#B3A48E; --dim:#7E7060;
  --or:#8FA84F; --or-soft:rgba(143,168,79,.15);
  --cop:#D19A55; --gold:#E7B873; --glow:rgba(143,168,79,.18);
  --ok:#A8C75E; --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--tx);
  font-family:'Heebo',system-ui,sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(900px 500px at 92% -8%, rgba(143,168,79,.16), transparent 62%),
    radial-gradient(760px 480px at 0% 42%, rgba(209,154,85,.08), transparent 64%),
    linear-gradient(155deg, rgba(255,255,255,.025), transparent 32%);
  background-attachment:fixed;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
h1,h2,h3{font-family:'Frank Ruhl Libre',Georgia,serif;margin:0;font-weight:700;letter-spacing:-.02em}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

.top{
  position:sticky;top:0;z-index:20;background:rgba(12,12,14,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
}
.brand{font-family:'Heebo';font-weight:900;font-size:12px;letter-spacing:.14em;color:var(--dim)}
.brand .dot{width:6px;height:6px;border-radius:50%;background:var(--or);display:inline-block}
.top h1{font-size:22px;margin-top:3px}
.top .sub{color:var(--mut);font-size:13px;margin-top:2px}
.top:after{content:'';display:block;position:absolute;right:0;left:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--or),transparent);opacity:.45}

.wrap{padding:16px 14px 0;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.hero{position:relative;overflow:hidden;padding:24px 20px 20px;margin-bottom:16px;border-color:var(--line2);background:linear-gradient(135deg,rgba(52,40,30,.98),rgba(43,33,25,.93));box-shadow:0 18px 44px rgba(0,0,0,.22)}
.hero:before{content:'';position:absolute;width:210px;height:210px;border:1px solid rgba(231,184,115,.18);border-radius:50%;left:-92px;top:-112px;box-shadow:0 0 0 18px rgba(231,184,115,.025),0 0 0 38px rgba(231,184,115,.018)}
.hero-kicker{position:relative;color:var(--gold);font-size:11px;letter-spacing:.16em;font-weight:700;margin-bottom:8px}
.hero h2{position:relative;font-size:28px;line-height:1.15;max-width:420px}
.hero p{position:relative;color:var(--mut);margin:8px 0 0;font-size:14px;max-width:470px}
.hero-meta{position:relative;display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.hero-chip{border:1px solid rgba(231,184,115,.28);background:rgba(231,184,115,.08);border-radius:20px;padding:5px 10px;color:#EFD7B5;font-size:12px}
.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.overview-card{background:rgba(52,40,30,.78);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.overview-card strong{display:block;font-family:Heebo;font-size:22px;color:var(--or);line-height:1.1}
.overview-card span{display:block;color:var(--mut);font-size:11.5px;margin-top:4px}
.section-head{display:flex;align-items:baseline;gap:8px;margin:20px 2px 9px}
.section-head h3{font-size:17px;flex:1}
.section-head span{color:var(--dim);font-size:12px}

.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.days button{
  flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);
  padding:8px 15px;border-radius:10px;font-weight:500;white-space:nowrap;
}
.days button.on{background:var(--or-soft);border-color:var(--or);color:var(--or);font-weight:700}

/* ---- יום אימון כתיקייה ---- */
.dayc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.dayc.on{border-color:var(--line2)}
.dayc.full{border-color:rgba(168,199,94,.4)}
.dayc.today{box-shadow:0 0 0 1px rgba(231,184,115,.28),0 12px 30px rgba(0,0,0,.15)}
.dayc.today .dayh:after{content:'היום';color:var(--gold);font-size:11px;border:1px solid rgba(231,184,115,.32);border-radius:20px;padding:3px 8px}
.dayh{width:100%;background:none;border:0;padding:13px 14px;display:flex;align-items:center;gap:12px;text-align:right}
.daynum{
  width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-family:'Heebo';font-weight:800;font-size:13px;
  background:var(--or-soft);color:var(--or);border:1px solid rgba(143,168,79,.32);
}
.dayc.on .daynum{background:var(--or);color:#141A06;border-color:var(--or)}
.dayc.full .daynum{background:var(--ok);color:#0D1503;border-color:var(--ok)}
.dayt{flex:1;min-width:0}
.dayn{display:block;font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;font-size:16px;line-height:1.25}
.daym{display:block;color:var(--dim);font-size:12px;margin-top:3px}
.daym em{font-style:normal;color:var(--or);font-weight:700}
.daychev{
  width:8px;height:8px;flex:none;transform:rotate(45deg);transition:transform .22s;
  border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);
}
.dayc.on .daychev{transform:rotate(-135deg)}
.dayb{display:none;padding:0 12px 4px}
.dayc.on .dayb{display:block}

.ex{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card);transition:border-color .15s}
.ex.done{border-color:rgba(168,199,94,.45);background:rgba(168,199,94,.05)}
.ex .hd{display:flex;align-items:flex-start;gap:11px}
.ex .nm{font-weight:700;font-size:16px;flex:1;min-width:0;line-height:1.3}
.ex .meta{color:var(--mut);font-size:13px;margin-top:3px}
.ex .note{color:var(--or);font-size:12.5px;margin-top:6px}
/* 44px ולא 30: זה הכפתור שנלחץ אחרי כל סט, באמצע חדר כושר
   ועם ידיים מזיעות. מתחת ל-44 החטאות מתחילות. */
.chk{
  flex:0 0 auto;width:44px;height:44px;border-radius:12px;border:2px solid var(--line2);
  background:none;display:grid;place-items:center;font-size:22px;color:transparent;transition:.15s;
  -webkit-tap-highlight-color:transparent;cursor:pointer
}
.chk:active{transform:scale(.93)}
.ex.done .chk{background:var(--ok);border-color:var(--ok);color:#141A06}
.logs{display:flex;gap:8px;margin-top:11px}
/* גובה 48 ומספר גדול: מקלידים כאן בין סטים, וצריך
   לראות מרחוק מה נרשם בפעם הקודמת. */
.logs input{
  flex:1;min-width:0;background:var(--ink);border:1px solid var(--line2);border-radius:11px;
  min-height:48px;padding:10px;font-size:17px;font-weight:700;text-align:center;color:var(--tx)
}
.logs input:focus{border-color:var(--or);outline:none}
.logs input::placeholder{color:var(--dim);font-size:13.5px;font-weight:400}

.bar{
  position:fixed;bottom:0;right:0;left:0;z-index:30;
  background:rgba(18,18,21,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px
}
.bar .prog{flex:1;font-size:13px;color:var(--mut)}
.bar .prog b{color:var(--tx);font-family:'Heebo'}
.bar .bar-title{font-size:11px;color:var(--gold);letter-spacing:.08em;margin-bottom:1px}
.bar .bar-copy{font-size:13px;color:var(--mut)}
.btn{background:var(--or);color:#141A06;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-family:'Heebo';font-size:15px}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.login-shell{max-width:470px;margin:7vh auto 0}
.login-brand{color:var(--gold);font-size:11px;letter-spacing:.18em;font-weight:800;margin-bottom:9px}
.login-shell .card{padding:24px 20px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.login-shell h2{font-size:27px;line-height:1.15}
.login-shell .login-intro{color:var(--mut);font-size:14px;margin:8px 0 20px}
.login-shell label{display:block;color:var(--mut);font-size:13px;margin-top:12px}
.login-shell input{margin-top:6px}
.login-shell .login-mark{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--or-soft);border:1px solid rgba(143,168,79,.35);color:var(--or);font-size:25px;margin-bottom:16px}

.mt{color:var(--mut)}
.mt b{color:var(--tx);font-family:'Heebo'}
.msg{text-align:center;padding:56px 24px;color:var(--mut)}
.msg h2{color:var(--tx);margin-bottom:8px;font-size:19px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--or);border-radius:50%;margin:0 auto 16px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.feel{display:flex;gap:8px;margin-top:10px}
.feel button{flex:1;background:var(--ink);border:1px solid var(--line);color:var(--mut);padding:10px;border-radius:10px;font-size:14px}
.feel button.on{border-color:var(--or);color:var(--or);background:var(--or-soft)}
#toast{
  position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));right:50%;transform:translate(50%,14px);
  background:#25252E;border:1px solid var(--line2);padding:11px 18px;border-radius:11px;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;font-size:14px;max-width:90vw;text-align:center
}
#toast.on{opacity:1;transform:translate(50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.category-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:18px}
.category-tile{appearance:none;text-align:center;background:linear-gradient(145deg,rgba(52,40,30,.98),rgba(43,33,25,.9));border:1px solid var(--line);border-radius:var(--r);padding:16px 10px;color:var(--tx);min-height:142px;transition:.18s;box-shadow:0 8px 22px rgba(0,0,0,.12)}
.category-tile:hover,.category-tile:focus-visible{border-color:var(--or);transform:translateY(-2px);box-shadow:0 12px 28px rgba(0,0,0,.2)}
.category-icon{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 10px;border:0;border-radius:0;background:transparent;color:var(--or);font-size:44px;line-height:1;box-shadow:none}
.category-icon svg{display:block;width:100%;height:100%}
.category-tile strong{display:block;font-size:14px}.category-tile span{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.category-modal{position:fixed;inset:0;z-index:90;background:rgba(18,13,9,.78);backdrop-filter:blur(12px);display:flex;align-items:flex-end;justify-content:center;padding:18px}
.category-dialog{width:min(720px,100%);max-height:min(88vh,820px);overflow:auto;background:var(--ink);border:1px solid var(--line2);border-radius:18px 18px 8px 8px;box-shadow:0 24px 70px rgba(0,0,0,.48);padding:18px 16px 28px;animation:modalIn .2s ease-out}
.category-dialog-head{display:flex;align-items:center;gap:10px;padding-bottom:13px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.category-dialog-head h2{font-size:22px;flex:1}.category-dialog-head p{margin:2px 0 0;color:var(--mut);font-size:12px}
.category-close{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:18px}
/* גלילה דקה ומותאמת למותג בתוך החלונות */
.category-dialog,.days{scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.category-dialog::-webkit-scrollbar,.days::-webkit-scrollbar{width:8px;height:8px}
.category-dialog::-webkit-scrollbar-track,.days::-webkit-scrollbar-track{background:transparent}
.category-dialog::-webkit-scrollbar-thumb,.days::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
.category-dialog::-webkit-scrollbar-thumb:hover,.days::-webkit-scrollbar-thumb:hover{background:var(--mut);background-clip:padding-box}
.category-dialog{overscroll-behavior:contain}
/* מצב עריכה בתוך מודל האימון */
.editbar{display:flex;gap:8px;margin-bottom:12px}
.editbar .btn{flex:1;font-size:13.5px;padding:9px 10px}
.ex.editing{border-color:var(--line2)}
.ex.editing .hd input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:15px;font-weight:700}
.editgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:9px}
.editgrid label{display:block;color:var(--dim);font-size:11px}
.editgrid input,.exnote{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 6px;font-size:14px;text-align:center;margin-top:3px}
.exnote{text-align:right;margin-top:7px}
.editrow{display:flex;gap:7px;margin-top:9px}
.editrow input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 6px;font-size:13px;text-align:center}
.delbtn{flex:none;width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:transparent;color:var(--dim);font-size:15px;display:grid;place-items:center}
.delbtn:hover{color:#D9605A;border-color:#D9605A}
.dayedit{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.dayedit input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px}
@media(max-width:520px){.editgrid{grid-template-columns:repeat(2,1fr)}}
@keyframes modalIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:700px){.category-modal{align-items:center}.category-dialog{border-radius:18px}}
@media(max-width:520px){.hero{padding:21px 16px 17px}.hero h2{font-size:24px}.overview-card{text-align:center;padding:10px 5px}.overview-card strong{font-size:19px}.overview-card span{font-size:10.5px}.category-tile{min-height:116px;padding:11px 6px}.category-icon{width:48px;height:48px;font-size:38px;margin-bottom:7px}.category-tile strong{font-size:13px}.category-tile span{font-size:10px}}

/* ═══════════ חום, קווים מנחים ומעגלים ═══════════
   הלוח היה חום־ירקרק עם ירוק דומיננטי. הנחושת והזהב כבר היו מוגדרים
   כמשתנים אבל כמעט לא בשימוש, ולכן הדף נקרא ירוק ולא חם. כאן הם
   נכנסים לתפקיד: הירוק נשאר צבע ההצלחה בלבד, והחום נושא את המבנה.

   כל הקישוטים הם pointer-events:none ו-aria-hidden בפועל (פסאודו),
   כדי שלא ייכנסו לסדר הקריאה של קורא מסך ולא יחטפו לחיצות. */

:root{
  --warm:#3E2E20;            /* חום עמוק לקווים ולמסגרות */
  --warm-2:#4A3726;
  --ring:rgba(209,154,85,.16);
}

/* רקע: טבעות רחבות ורכות במקום כתם אחיד */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(circle at 88% 6%, var(--ring) 0 1px, transparent 1px) 0 0/100% 100%,
    repeating-radial-gradient(circle at 88% 6%, transparent 0 58px, var(--ring) 58px 59px),
    repeating-radial-gradient(circle at 6% 94%, transparent 0 74px, rgba(143,168,79,.07) 74px 75px);
  mask-image:linear-gradient(180deg, #000 0 42%, transparent 78%);
  -webkit-mask-image:linear-gradient(180deg, #000 0 42%, transparent 78%);
}
#wrap{position:relative;z-index:1}

/* כרטיסים: קו אור דק למעלה, ומסגרת חמה יותר */
.card,.dayc{border-color:var(--warm-2)}
.card{position:relative;background:linear-gradient(168deg,rgba(62,46,32,.55),var(--card) 46%)}
.card::before{
  content:'';position:absolute;inset:0 0 auto 0;height:1px;border-radius:var(--r) var(--r) 0 0;
  background:linear-gradient(90deg,transparent,rgba(231,184,115,.28),transparent);
  pointer-events:none;
}

/* אריחי הקטגוריות: טבעת נחושת שנדלקת במגע */
.category-tile{position:relative;overflow:hidden;border-color:var(--warm-2)}
.category-tile::after{
  content:'';position:absolute;inset-inline-end:-34px;inset-block-start:-34px;
  width:104px;height:104px;border-radius:50%;
  border:1px solid rgba(209,154,85,.22);
  box-shadow:0 0 0 12px rgba(209,154,85,.05);
  transition:.22s;pointer-events:none;
}
.category-tile:hover::after,.category-tile:focus-visible::after{
  border-color:rgba(231,184,115,.5);transform:scale(1.08);
}
.category-icon{position:relative}

/* מספר היום: טבעת כפולה במקום עיגול שטוח */
.daynum{box-shadow:0 0 0 3px rgba(209,154,85,.12), 0 0 0 4px rgba(209,154,85,.07)}

/* קו מנחה לשימוש חוזר */
.rule{height:1px;border:0;margin:14px 0;
  background:linear-gradient(90deg,transparent,var(--warm-2) 18%,var(--warm-2) 82%,transparent)}

/* ═══════════ המאמן החכם ═══════════ */
.bot-card{
  border-color:rgba(209,154,85,.42);
  background:
    radial-gradient(120px 120px at 96% -14%, rgba(209,154,85,.13), transparent 70%),
    linear-gradient(168deg,rgba(74,55,38,.6),var(--card) 52%);
}
.bot-dot{
  width:9px;height:9px;border-radius:50%;background:var(--cop);flex:none;
  box-shadow:0 0 0 3px rgba(209,154,85,.18), 0 0 0 6px rgba(209,154,85,.08);
  animation:botPulse 2.6s ease-in-out infinite;
}
@keyframes botPulse{
  0%,100%{box-shadow:0 0 0 3px rgba(209,154,85,.18), 0 0 0 6px rgba(209,154,85,.08)}
  50%    {box-shadow:0 0 0 4px rgba(209,154,85,.26), 0 0 0 9px rgba(209,154,85,.03)}
}
@media (prefers-reduced-motion:reduce){ .bot-dot{animation:none} }
.bot-msg{padding:8px 11px;margin-top:8px;border-radius:0 9px 9px 0;background:rgba(0,0,0,.16)}
.bot-msg:first-of-type{margin-top:0}

/* פתק ההערה של המתאמן עצמו */
.tnote-mine{border-color:rgba(209,154,85,.4);background:rgba(209,154,85,.07)}

/* ═══════════ גרפים ═══════════ */
.ch{width:100%;height:auto;display:block;margin-top:6px;overflow:visible}
.ch-grid{stroke:var(--warm-2);stroke-width:1;stroke-dasharray:2 5}
.ch-lbl{fill:var(--dim);font-size:8.5px;font-family:Heebo,sans-serif;text-anchor:end}
.ch-val{fill:var(--tx);font-size:10.5px;font-family:Heebo,sans-serif;font-weight:700}
.ch-last{filter:drop-shadow(0 0 5px rgba(231,184,115,.55))}

/* ═══════════ המסע ═══════════ */
.jr-card{
  border-color:rgba(209,154,85,.4);
  background:
    radial-gradient(150px 150px at 94% -18%, rgba(231,184,115,.13), transparent 72%),
    linear-gradient(168deg,rgba(74,55,38,.55),var(--card) 54%);
}
.jr-chip{
  font-size:11.5px;font-weight:800;padding:4px 11px;border-radius:99px;
  border:1px solid var(--line2);color:var(--mut);white-space:nowrap;
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">E.B<span class="dot"></span>FIT</div>
  <h1 id="hTitle">טוען…</h1>
  <div class="sub" id="hSub"></div>
</header>

<div class="wrap" id="wrap">
  <div class="msg"><div class="spin"></div>מביא את התוכנית שלך…</div>
</div>

<div id="toast"></div>

<script src="vendor/supabase.js?v=v99"></script>
<script src="config.js?v=v99"></script>
<script src="meal-library.js?v=v99"></script>
<script src="exercise-library.js?v=v99"></script>
<script src="progress.js?v=v99"></script>
<script src="coach-bot.js?v=v99"></script>
<script src="health.js?v=v99"></script>
<script src="privacy.js?v=v99"></script>
<script>
(function () {
  'use strict';
  const CFG   = window.EBFIT_CONFIG || {};
  let TOKEN = location.hash.replace(/^#/, '').trim();
  let CACHE = 'ebfit_t_' + TOKEN.slice(0, 12);

  const $  = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s)
    .replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  let DATA = null, DAY = 0, STATE = {}, FEEL = null, sb = null;

  /* הארוחות שהמתאמן בחר לעצמו. נשמרות גם במכשיר וגם בשרת: המכשיר
     כדי שההוספה תהיה מיידית וגם בלי רשת, והשרת כדי שהמאמן יראה. */
  let MY_MEALS = [];

  /* התרגילים שהמתאמן בחר לעצמו. נשמרים במכשיר ובשרת, כמו הארוחות —
     המכשיר לתגובה מיידית וגם בלי רשת, השרת כדי שהמאמן יראה. */
  let MY_EX = [], EX_OPEN = false, EX_Q = '', EX_MUS = 'all';

  /* מצב עריכה במודל האימון: השינויים נצברים מקומית ונשמרים לשרת
     רק בלחיצה על שמירה, כדי שהמאמן יראה עדכון אחד שלם. */
  let EDIT_W = false, EDIT_SNAP = null, EDIT_EX_SNAP = null;
  const exKey = () => 'ebfit_myex_' + String(TOKEN || '').slice(0, 12);
  function readEx() { try { return JSON.parse(localStorage.getItem(exKey())) || []; } catch (e) { return []; } }
  function writeEx() { try { localStorage.setItem(exKey(), JSON.stringify(MY_EX)); } catch (e) {} }
  const inEx = id => MY_EX.some(x => x.exId === id);
  const myKey = () => 'ebfit_my_' + String(TOKEN || '').slice(0, 12);
  function readMy() { try { return JSON.parse(localStorage.getItem(myKey())) || []; } catch (e) { return []; } }
  function writeMy() { try { localStorage.setItem(myKey(), JSON.stringify(MY_MEALS)); } catch (e) {} }
  const inMy = id => MY_MEALS.some(x => x.libId === id);

  function toast(m) {
    const t = $('#toast'); t.textContent = m; t.classList.add('on');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2400);
  }
  function screen(html) {
    $('#wrap').innerHTML = html;
    // בלי תוכנית טעונה הכותרת לא צריכה להישאר על "טוען…"
    if (!DATA) { $('#hTitle').textContent = 'התוכנית שלי'; $('#hSub').textContent = ''; }
  }

  /* ---------- טעינה ---------- */
  async function boot() {
    if (!CFG.URL || !CFG.ANON) return screen(msg('המערכת עוד לא מחוברת', 'המאמן צריך לסיים את ההגדרה.'));
    sb = supabase.createClient(CFG.URL, CFG.ANON);

    // אין טוקן בכתובת? אולי המכשיר כבר התחבר בעבר.
    if (!TOKEN) TOKEN = localStorage.getItem('ebfit_t_token') || '';
    if (!TOKEN) return loginScreen();

    CACHE = 'ebfit_t_' + TOKEN.slice(0, 12);
    if (window.EBProg) { EBProg.load(TOKEN); EBProg.attach(sb, TOKEN); }
    STATE = readState();
    MY_MEALS = readMy();
    BUILD = readBuild();
    MY_EX = readEx();

    // קודם מהמטמון — כדי שהתוכנית תיפתח מיד גם בלי רשת
    const cached = readCache();
    if (cached) { DATA = cached; paint(); }

    try {
      const { data, error } = await sb.rpc('trainee_program', { p_token: TOKEN });
      if (error) throw error;
      if (!data || !data.length) {
        if (cached) return toast('אין חיבור — מוצגת הגרסה השמורה');
        return screen(msg('הקישור לא פעיל', 'ייתכן שהמאמן ביטל את הגישה. פנה אליו.'));
      }
      DATA = data[0];
      mergeMy(DATA.meals_self);
      mergeEx(DATA.exercises_self);
      if (window.EBProg) EBProg.mergeServer(DATA.weighins);
      writeCache(DATA);
      paint();
      loadExtras();
    } catch (e) {
      if (!DATA) screen(msg('לא הצלחנו להתחבר', 'בדוק חיבור לאינטרנט ונסה שוב.'));
      else toast('אין חיבור — מוצגת הגרסה השמורה');
    }
    startAutoRefresh();
  }

  /* ---------- ריענון אוטומטי ----------
     המאמן עורך את הנתונים בלוח הניהול, וכאן אין ערוץ realtime מול השרת.
     כדי שהעדכון יגיע בלי שהמתאמן יצטרך לרענן ידנית, שולפים מחדש
     כל פרק זמן, וגם כשחוזרים לטאב/לאפליקציה. */
  let REFRESH_TIMER = null, REFRESHING = false;
  /* פתיחה/סגירה של מודלים גם בריענון — התוכן מתחתם מחדש */
  async function refreshData(silent) {
    if (EDIT_W || !TOKEN || !sb || REFRESHING) return;
    REFRESHING = true;
    try {
      const { data, error } = await sb.rpc('trainee_program', { p_token: TOKEN });
      if (error) throw error;
      if (!data || !data.length) return;
      const fresh = data[0];
      if (JSON.stringify(fresh) === JSON.stringify(DATA)) return; // אין שינוי
      DATA = fresh;
      mergeMy(DATA.meals_self);
      mergeEx(DATA.exercises_self);
      if (window.EBProg) EBProg.mergeServer(DATA.weighins);
      writeCache(DATA);
      paint();
      if (OPEN_CATEGORY) {
        const body = document.querySelector('#categoryModal .category-dialog-body');
        if (body) body.innerHTML = categoryContent(OPEN_CATEGORY);
      }
      if (EX_OPEN) refreshExModalBody();
      if (!silent) toast('התוכנית עודכנה');
    } catch (e) { /* בלי רשת — משאירים את מה שכבר מוצג */ }
    finally { REFRESHING = false; }
  }

  function startAutoRefresh() {
    if (REFRESH_TIMER) return;
    REFRESH_TIMER = setInterval(() => {
      if (document.visibilityState === 'visible') refreshData(true);
    }, 45000);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') refreshData(true);
    });
    window.addEventListener('focus', () => refreshData(true));
  }

  function msg(h, p) { return '<div class="msg"><h2>' + esc(h) + '</h2>' + esc(p) + '</div>'; }

  /* ---------- כניסה עם שם משתמש ---------- */
  function loginScreen(err) {
    DATA = null;
    screen('<div class="login-shell"><div class="login-brand">E.B FIT · PERSONAL COACHING</div><div class="card">'
      + '<div class="login-mark">✦</div><h2>המרחב האישי שלך</h2>'
      + '<p class="login-intro">התחבר כדי לפתוח את התוכנית, לעקוב אחרי האימונים ולראות את היעדים שלך.</p>'
      + '<label style="font-size:13px;color:var(--mut)">שם משתמש</label>'
      + '<input id="lg_u" autocapitalize="none" autocorrect="off" spellcheck="false" '
      + 'style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;'
      + 'padding:12px;margin:6px 0 12px;font-size:16px;direction:ltr;text-align:left">'
      + '<label style="font-size:13px;color:var(--mut)">סיסמה</label>'
      + '<input id="lg_p" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" '
      + 'style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;'
      + 'padding:12px;margin:6px 0 4px;font-size:16px;direction:ltr;text-align:left">'
      + (err ? '<div style="color:#D9605A;font-size:13px;margin-top:8px">' + esc(err) + '</div>' : '')
      + '<button class="btn" id="lg_go" style="width:100%;margin-top:14px">כניסה למרחב שלי</button>'
      + '<div style="text-align:center;color:var(--dim);font-size:12px;margin-top:13px">הפרטים שקיבלת מהמאמן נשמרים באופן פרטי.</div>'
      + '</div></div>');
    var go = document.getElementById('lg_go');
    go.onclick = doLogin;
    document.getElementById('lg_p').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });
  }

  async function doLogin() {
    var u = (document.getElementById('lg_u') || {}).value || '';
    var p = (document.getElementById('lg_p') || {}).value || '';
    if (!u.trim() || !p) { loginScreen('צריך למלא שם משתמש וסיסמה'); return; }
    var btn = document.getElementById('lg_go');
    if (btn) { btn.disabled = true; btn.textContent = 'בודק…'; }
    try {
      /* שני ניסיונות, בסדר הזה.

         כפי שהוקלד — כי סיסמה שהמאמן הגדיר ידנית לפני v67 יכולה
         להכיל אות גדולה, וההורדה לאותיות קטנות שנוספה אז שברה אותה
         בשקט. זו הייתה רגרסיה שלי.

         באותיות קטנות — כי מקלדת הטלפון מגדילה את האות הראשונה
         בשדה סיסמה, וזה הכשל הנפוץ ביותר.

         שני הניסיונות יחד מכסים את שני המקרים בלי לשבור אף אחד.
         הנעילה בשרת סופרת כישלונות, ולכן הניסיון השני נעשה רק אם
         הסיסמה באמת שונה אחרי ההורדה. */
      var uName = u.trim().toLowerCase();
      var pRaw  = String(p);
      var pLow  = pRaw.toLowerCase();

      var r = await sb.rpc('trainee_login', { p_username: uName, p_password: pRaw });
      var d = (!r.error && r.data && r.data[0]) ? r.data[0] : null;

      if (!d && pLow !== pRaw) {
        r = await sb.rpc('trainee_login', { p_username: uName, p_password: pLow });
        d = (!r.error && r.data && r.data[0]) ? r.data[0] : null;
      }

      if (!d) {
        /* הודעה שמבחינה בין המצבים, כי "שגוי" לא עוזר למתאמן */
        var m = String((r.error && r.error.message) || '');
        if (/locked|locked_until/i.test(m)) {
          throw new Error('החשבון ננעל לרבע שעה אחרי כמה ניסיונות. נסה שוב בעוד 15 דקות.');
        }
        throw new Error('שם משתמש או סיסמה שגויים. בדוק שאין רווח בסוף, ופנה למאמן אם זה חוזר.');
      }

      TOKEN = d.token;
      CACHE = 'ebfit_t_' + TOKEN.slice(0, 12);
    if (window.EBProg) { EBProg.load(TOKEN); EBProg.attach(sb, TOKEN); }
    STATE = readState();
    MY_MEALS = readMy();
    BUILD = readBuild();
    MY_EX = readEx();
      try { localStorage.setItem('ebfit_t_token', TOKEN); } catch (e) {}

      DATA = d;
      mergeMy(d.meals_self);
      mergeEx(d.exercises_self);
      if (window.EBProg) EBProg.mergeServer(d.weighins);
      writeCache(d);
      paint();
      loadExtras();
      startAutoRefresh();
    } catch (e) {
      loginScreen((e && e.message) || 'לא הצלחנו להיכנס');
    }
  }

  function logout() {
    try {
      localStorage.removeItem('ebfit_t_token');
      if (CACHE) localStorage.removeItem(CACHE);
    } catch (e) {}
    if (REFRESH_TIMER) { clearInterval(REFRESH_TIMER); REFRESH_TIMER = null; }
    TOKEN = ''; DATA = null;
    var b = document.querySelector('.bar'); if (b) b.remove();
    $('#hTitle').textContent = 'התוכנית שלי'; $('#hSub').textContent = '';
    location.hash = '';
    loginScreen();
  }
  window.__ebLogout = logout;

  /* ---------- תפריט הארוחות ----------
     תמונה שווה יותר מרשימת מרכיבים: המתאמן רואה מה בדיוק לשים בצלחת.
     הערכים מוצגים לצד כל ארוחה, וסיכום יומי בראש. */
  const MEAL_TYPES = { breakfast:'בוקר', lunch:'צהריים', dinner:'ערב',
                       snack:'ביניים', pre:'לפני אימון', post:'אחרי אימון' };

  function mealsBlock(meals) {
    if (!meals || !meals.length) return '';
    const n = v => { const x = Number(v); return isFinite(x) && x > 0 ? x : 0; };
    const tot = meals.reduce((a,m) => ({
      kcal:a.kcal+n(m.kcal), p:a.p+n(m.protein), c:a.c+n(m.carbs), f:a.f+n(m.fat)
    }), {kcal:0,p:0,c:0,f:0});

    let h = '<div class="card" style="margin-bottom:12px">'
      + '<div style="font-size:13px;color:var(--mut);margin-bottom:10px">התפריט שלך · '
      + meals.length + ' ארוחות</div>';

    if (tot.kcal) {
      h += '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:4px">'
        + '<span><b style="font-family:Heebo;color:var(--or)">' + tot.kcal + '</b> קק״ל</span>'
        + (tot.p ? '<span class="mt">חלבון <b>' + tot.p + '</b></span>' : '')
        + (tot.c ? '<span class="mt">פחמימות <b>' + tot.c + '</b></span>' : '')
        + (tot.f ? '<span class="mt">שומן <b>' + tot.f + '</b></span>' : '')
        + '</div>';
    }
    h += '</div>';

    // מקובץ לפי סוג, בסדר היום
    const order = ['breakfast','pre','post','lunch','snack','dinner','other'];
    const by = {};
    meals.forEach(m => { const k = MEAL_TYPES[m.type] ? m.type : 'other';
                         (by[k] = by[k] || []).push(m); });

    order.forEach(k => {
      const g = by[k];
      if (!g) return;
      h += '<div style="font-size:12px;color:var(--dim);letter-spacing:.1em;margin:14px 0 8px">'
        + esc(MEAL_TYPES[k] || 'נוספות') + '</div>';
      g.forEach(m => {
        h += '<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">'
          + (m.photo
              ? '<img src="' + esc(m.photo) + '" alt="' + esc(m.name||'') + '" loading="lazy" '
                + 'style="width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--ink)">'
              : '')
          + '<div style="padding:13px">'
          + '<div style="font-family:Heebo;font-weight:700;font-size:16px;line-height:1.3">'
          + esc(m.name || 'ארוחה') + '</div>'
          + (m.desc ? '<div style="color:var(--mut);font-size:13.5px;margin-top:5px;line-height:1.5;white-space:pre-wrap">'
                      + esc(m.desc) + '</div>' : '')
          + (n(m.kcal)||n(m.protein)||n(m.carbs)||n(m.fat)
              ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">'
                + (n(m.kcal)    ? tag(n(m.kcal) + ' קק״ל', 1) : '')
                + (n(m.protein) ? tag('חלבון ' + n(m.protein)) : '')
                + (n(m.carbs)   ? tag('פחמימות ' + n(m.carbs)) : '')
                + (n(m.fat)     ? tag('שומן ' + n(m.fat)) : '')
                + '</div>' : '')
          + '</div></div>';
      });
    });
    return h;
  }
  function tag(txt, hot) {
    return '<span style="font-size:12px;padding:4px 10px;border-radius:20px;white-space:nowrap;'
      + (hot ? 'background:var(--or-soft);color:var(--or);border:1px solid rgba(255,106,26,.3)'
             : 'background:var(--card);color:var(--mut);border:1px solid var(--line)') + '">'
      + esc(txt) + '</span>';
  }

  /* ---------- ספריית הארוחות ----------
     כל 42 הארוחות זמינות לכל מתאמן, גם אלה שלא שויכו לו. הטבלה של
     כל ארוחה סגורה כברירת מחדל — 42 טבלאות פתוחות בטלפון הופכות
     את המסך לבלתי קריא. */
  let LIB_OPEN = false, LIB_Q = '', LIB_TYPE = 'all', LIB_ROW = {}, LIB_TAB = 'meals';

  /* מחשבון הארוחה. מחליף את הצורך לצלם: בוחרים מוצרים, כותבים כמה
     גרם, ומקבלים את הערכים. נשמר במכשיר כדי ששורה שהוקלדה לא תיעלם
     בגלילה או ברענון. */
  let BUILD = [];
  const buildKey = () => 'ebfit_build_' + String(TOKEN || '').slice(0, 12);
  function readBuild() { try { return JSON.parse(localStorage.getItem(buildKey())) || []; } catch (e) { return []; } }
  function writeBuild() { try { localStorage.setItem(buildKey(), JSON.stringify(BUILD)); } catch (e) {} }
  function buildTotals() {
    let k = 0, p = 0, c = 0, f = 0;
    BUILD.forEach(x => {
      const v = EBLib.DB[x.n]; if (!v) return;
      const g = Number(x.g) || 0;
      k += v[0]*g/100; p += v[1]*g/100; c += v[2]*g/100; f += v[3]*g/100;
    });
    return { k, p, c, f };
  }

  function r1(x){ return Math.round(x*10)/10; }

  function libButton() {
    if (typeof EBLib === 'undefined') return '';
    return '<button class="btn ghost" style="width:100%;margin-bottom:12px;font-size:14px" '
      + 'onclick="__libOpen()">כל הארוחות · ' + EBLib.MEALS.length + ' עם ערכים מלאים'
      + (MY_MEALS.length ? ' · <b style="color:var(--or)">' + MY_MEALS.length + ' שלי</b>' : '')
      + '</button>';
  }

  function libScreen() {
    const q = LIB_Q.trim();
    /* אוכל לא כשר לא ברשימה הרגילה — רק בקטגוריה שלו */
    const only = (LIB_TYPE === 'nonkosher');
    const items = EBLib.MEALS.filter(m => {
      const k = EBLib.kosherOf(m);
      if (only) { if (k === 'ok') return false; }
      else {
        if (k !== 'ok') return false;
        if (LIB_TYPE !== 'all' && m.type !== LIB_TYPE) return false;
      }
      if (!q) return true;
      return m.name.indexOf(q) > -1 || m.items.some(p => p[0].indexOf(q) > -1);
    });
    const counts = EBLib.byType();

    let h = '<button class="btn ghost" style="margin-bottom:12px" onclick="__libClose()">‹ חזרה לתוכנית</button>'
      + '<input id="lq" placeholder="חיפוש ארוחה או מרכיב" value="' + esc(LIB_Q) + '" '
      + 'oninput="__libSearch(this.value)" style="width:100%;background:var(--card);'
      + 'border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;margin-bottom:10px">'
      + '<div style="display:flex;gap:6px;margin-bottom:12px">'
      + libTab('meals','ארוחות',EBLib.MEALS.length)
      + libTab('prod','מוצרים בודדים',Object.keys(EBLib.DB).length)
      + '</div>';

    if (LIB_TAB === 'prod') return h + buildPanel() + prodTable();

    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">'
      + libTag('all','הכול',EBLib.MEALS.filter(m=>EBLib.kosherOf(m)==='ok').length);
    ['breakfast','pre','post','lunch','snack','dinner'].forEach(k => {
      if (counts[k]) h += libTag(k, EBLib.TYPES[k], counts[k].length);
    });
    const nk = EBLib.MEALS.filter(m => EBLib.kosherOf(m) !== 'ok').length;
    if (nk) h += libTag('nonkosher', 'לא כשר', nk);
    h += '</div><div style="color:var(--mut);font-size:12.5px;margin-bottom:10px">' + items.length + ' ארוחות</div>';

    if (!items.length) h += '<div class="msg">לא נמצאה ארוחה מתאימה.</div>';
    items.forEach(m => h += libCard(m));
    return h;
  }

  function libTab(k, label, n) {
    const on = LIB_TAB === k;
    return '<button data-libtab="' + k + '" style="flex:1;font-size:13px;padding:9px 10px;'
      + 'border-radius:10px;cursor:pointer;font-family:Heebo;font-weight:700;'
      + 'border:1px solid ' + (on ? 'var(--or)' : 'var(--line)') + ';'
      + 'background:' + (on ? 'var(--or-soft)' : 'var(--card)') + ';'
      + 'color:' + (on ? 'var(--or)' : 'var(--mut)') + '">'
      + esc(label) + ' <span style="opacity:.6">' + n + '</span></button>';
  }

  function libTag(k, label, n) {
    const on = LIB_TYPE === k;
    return '<button data-lt="' + esc(k) + '" style="font-size:12.5px;padding:6px 12px;'
      + 'border-radius:20px;white-space:nowrap;border:1px solid ' + (on?'var(--or)':'var(--line)') + ';'
      + 'background:' + (on?'var(--or-soft)':'var(--card)') + ';color:' + (on?'var(--or)':'var(--mut)') + '">'
      + esc(label) + ' <span style="opacity:.6">' + n + '</span></button>';
  }

  /* השרת הוא המקור האמין. אם הוא החזיר רשימה — היא גוברת על המכשיר,
     כך שהוספה שנעשתה בטלפון אחר מופיעה גם כאן. */
  function mergeMy(fromServer) {
    if (!Array.isArray(fromServer)) return;      // העמודה עוד לא קיימת בשרת
    MY_MEALS = fromServer;
    writeMy();
  }

  async function myAdd(libId) {
    const meal = EBLib.byId(libId);
    if (!meal || inMy(libId)) return;
    MY_MEALS.push({ libId: libId, name: meal.name, at: todayStr() });
    writeMy(); refreshLib(libId);
    toast(meal.name + ' נוספה לתפריט שלך');
    try {
      const { data, error } = await sb.rpc('trainee_add_meal',
        { p_token: TOKEN, p_lib_id: libId, p_name: meal.name });
      if (error) throw error;
      mergeMy(data);
    } catch (e) {
      /* בלי הפונקציה בשרת ההוספה נשארת במכשיר. עדיין עובד למתאמן,
         רק שהמאמן לא רואה — ולכן הודעה אחת ולא כישלון. */
      toast('נשמר במכשיר. המאמן יראה אחרי שיסיים את ההגדרה.');
    }
  }

  async function myRemove(libId) {
    const wasCustom = MY_MEALS.some(x => x.custom && x.name === libId);
    MY_MEALS = MY_MEALS.filter(x => x.custom ? x.name !== libId : x.libId !== libId);
    if (wasCustom) { writeMy(); paint(); return; }   // מותאמת — מקומית בלבד
    writeMy(); refreshLib(libId);
    try {
      const { data, error } = await sb.rpc('trainee_remove_meal',
        { p_token: TOKEN, p_lib_id: libId });
      if (error) throw error;
      mergeMy(data);
    } catch (e) {}
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
         + '-' + String(d.getDate()).padStart(2,'0');
  }

  /* מעדכנים כרטיס אחד ולא מציירים מחדש — ציור מלא מחזיר את הגלילה
     לראש המסך, וזה בדיוק מה שתוקן בפירוט הארוחה. */
  function refreshLib(libId) {
    const el = document.querySelector('[data-mid="' + libId + '"] [data-my]');
    if (el) {
      const on = inMy(libId);
      el.textContent = on ? '✓ בתפריט שלי' : '+ הוספה לתפריט שלי';
      el.style.background = on ? 'var(--or-soft)' : 'transparent';
      el.style.color = on ? 'var(--or)' : 'var(--mut)';
      el.style.borderColor = on ? 'var(--or)' : 'var(--line2)';
    }
    const cnt = document.getElementById('myCount');
    if (cnt) cnt.textContent = MY_MEALS.length;
  }

  /* מה שהמתאמן הוסיף — מוצג בנפרד מהתפריט של המאמן, כדי שלא
     ייווצר רושם שהמאמן רשם את זה. */
  function myMealsBlock() {
    if (typeof EBLib === 'undefined' || !MY_MEALS.length) return '';
    const rows = MY_MEALS.map(x => {
      if (x.custom) return { name: x.name, custom: true, type: '',
                             tot: { k:x.k||0, p:x.p||0, c:x.c||0, f:x.f||0 }, key: x.name };
      const m = EBLib.byId(x.libId);
      if (!m) return null;
      const t = EBLib.calc(m.items).total;
      return { name: m.name, type: m.type, tot: t, key: m.id };
    }).filter(Boolean);
    if (!rows.length) return '';
    let k = 0, p = 0, c = 0, f = 0;
    rows.forEach(m => { k += m.tot.k; p += m.tot.p; c += m.tot.c; f += m.tot.f; });
    const r0 = x => Math.round(x);
    let h = '<div class="card" style="margin-bottom:12px;border-color:var(--line2)">'
      + '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">'
      + '<div style="flex:1;font-family:Frank Ruhl Libre,serif;font-weight:700;font-size:15px">'
      + 'הוספתי לעצמי</div>'
      + '<span class="mt" style="font-size:12px">' + rows.length + ' ארוחות</span></div>'
      + '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:10px">'
      + '<span><b style="font-family:Heebo;color:var(--or)">' + r0(k) + '</b> קק״ל</span>'
      + '<span class="mt">חלבון <b>' + r0(p) + '</b></span>'
      + '<span class="mt">פחמימות <b>' + r0(c) + '</b></span>'
      + '<span class="mt">שומן <b>' + r0(f) + '</b></span></div>';
    rows.forEach(m => {
      h += '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;'
        + 'border-top:1px solid var(--line)">'
        + '<div style="flex:1;min-width:0">'
        + '<div style="font-size:14px;font-weight:500">' + esc(m.name) + '</div>'
        + '<div class="mt" style="font-size:11.5px;margin-top:2px">'
        + esc(m.custom ? 'בניתי בעצמי' : (EBLib.TYPES[m.type] || '')) + '</div></div>'
        + '<span style="font-family:Heebo;font-weight:700;font-size:14px">'
        + Math.round(m.tot.k) + '</span>'
        + '<button data-myrm="' + esc(m.key) + '" style="background:none;border:0;'
        + 'color:var(--dim);font-size:17px;cursor:pointer;padding:0 4px;line-height:1">✕</button>'
        + '</div>';
    });
    return h + '</div>';
  }

  /* אותו מסד שממנו מחושבות הארוחות — לא רשימה שנייה שיכולה להתיישן */
  /* הפאנל מופיע רק כשיש מה להראות — פאנל ריק קבוע היה גוזל שליש
     ממסך הטלפון בלי לתת כלום. */
  function refreshTot() {
    const box = document.querySelector('[data-bsave]');
    if (!box) return;
    const t = buildTotals(), r0 = x => Math.round(x);
    const row = box.previousElementSibling;
    if (!row) return;
    row.innerHTML =
        '<span><b style="font-family:Heebo;font-size:19px;color:var(--or)">' + r0(t.k) + '</b> קק״ל</span>'
      + '<span class="mt">חלבון <b>' + r0(t.p) + '</b></span>'
      + '<span class="mt">פחמימות <b>' + r0(t.c) + '</b></span>'
      + '<span class="mt">שומן <b>' + r0(t.f) + '</b></span>';
  }

  /* נשמר במכשיר בלבד. אין לזה מזהה בספרייה, ולכן אין מה לשלוח
     לשרת בלי לשנות את מבנה הנתונים שם. */
  function saveBuild() {
    const items = BUILD.filter(x => Number(x.g) > 0);
    if (!items.length) { toast('הוסף מוצר קודם'); return; }
    const t = buildTotals();
    const name = items.slice(0, 3).map(x => x.n).join(' · ')
               + (items.length > 3 ? ' ועוד ' + (items.length - 3) : '');
    MY_MEALS.push({
      custom: true, name: name,
      items: items.map(x => [x.n, Number(x.g)]),
      k: Math.round(t.k), p: Math.round(t.p), c: Math.round(t.c), f: Math.round(t.f),
      at: todayStr()
    });
    writeMy();
    BUILD = []; writeBuild();
    toast('נשמר בתפריט שלך');
    screen(libScreen());
  }

  function buildPanel() {
    if (!BUILD.length) {
      return '<div class="card" style="margin-bottom:12px;background:transparent;border-style:dashed">'
        + '<div style="color:var(--mut);font-size:13px;line-height:1.6">'
        + 'לחץ <b style="color:var(--or)">+</b> ליד מוצר כדי לבנות ארוחה ולראות כמה יצא.'
        + '</div></div>';
    }
    const t = buildTotals(), r0 = x => Math.round(x);
    let h = '<div class="card" style="margin-bottom:12px;border-color:var(--or)">'
      + '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">'
      + '<div style="flex:1;font-family:Frank Ruhl Libre,serif;font-weight:700;font-size:15px">'
      + 'הארוחה שלי</div>'
      + '<button data-bclear style="background:none;border:0;color:var(--dim);'
      + 'font-size:12.5px;cursor:pointer;text-decoration:underline">ניקוי</button></div>';

    BUILD.forEach((x, i) => {
      h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;'
        + 'border-top:1px solid var(--line)">'
        + '<span style="flex:1;min-width:0;font-size:13.5px">' + esc(x.n) + '</span>'
        + '<input data-bg="' + i + '" type="number" inputmode="numeric" value="' + esc(x.g) + '" '
        + 'style="width:66px;background:var(--ink);border:1px solid var(--line);border-radius:8px;'
        + 'padding:6px;font-size:14px;text-align:center">'
        + '<span style="color:var(--dim);font-size:12px">גר׳</span>'
        + '<button data-brm="' + i + '" style="background:none;border:0;color:var(--dim);'
        + 'font-size:16px;cursor:pointer;padding:0 4px;line-height:1">✕</button></div>';
    });

    h += '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:11px;'
      + 'border-top:2px solid var(--or);font-size:13.5px">'
      + '<span><b style="font-family:Heebo;font-size:19px;color:var(--or)">' + r0(t.k) + '</b> קק״ל</span>'
      + '<span class="mt">חלבון <b>' + r0(t.p) + '</b></span>'
      + '<span class="mt">פחמימות <b>' + r0(t.c) + '</b></span>'
      + '<span class="mt">שומן <b>' + r0(t.f) + '</b></span></div>'
      + '<button class="btn" data-bsave style="width:100%;margin-top:11px">שמירה בתפריט שלי</button>'
      + '</div>';
    return h;
  }

  function prodTable() {
    const q = LIB_Q.trim();
    const onlyNk = (LIB_TYPE === 'nonkosher');
    const names = Object.keys(EBLib.DB)
      .filter(n => {
        const bad = EBLib.NONKOSHER.indexOf(n) > -1;
        if (onlyNk ? !bad : bad) return false;
        return !q || n.indexOf(q) > -1;
      })
      .sort((a, b) => a.localeCompare(b, 'he'));
    let h = '<div style="color:var(--dim);font-size:12.5px;margin-bottom:8px">'
      + names.length + ' מוצרים · הערכים ל-100 גרם</div>';
    if (!names.length) return h + '<div class="card" style="text-align:center;color:var(--mut)">לא נמצא מוצר מתאים.</div>';
    h += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px">'
      + '<thead><tr>' + lth('מוצר','right') + lth('קק״ל') + lth('חלבון') + lth('פחמ׳') + lth('שומן')
      + '</tr></thead><tbody>';
    names.forEach(n => {
      const v = EBLib.DB[n];
      const inB = BUILD.some(x => x.n === n);
      h += '<tr>'
         + '<td style="padding:5px 4px;border-bottom:1px solid var(--line);text-align:right">'
         + '<button data-badd="' + esc(n) + '" style="background:none;border:0;cursor:pointer;'
         + 'font-size:15px;line-height:1;padding:0 6px 0 0;color:'
         + (inB ? 'var(--or)' : 'var(--dim)') + '">' + (inB ? '✓' : '+') + '</button>'
         + esc(n) + '</td>'
         + ltd('<b>' + v[0] + '</b>') + ltd(r1(v[1])) + ltd(r1(v[2])) + ltd(r1(v[3])) + '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  function mergeEx(fromServer) {
    if (!Array.isArray(fromServer)) return;   // העמודה עוד לא קיימת בשרת
    MY_EX = fromServer;
    writeEx();
  }

  async function exAdd(id) {
    const x = EBEx.byId(id);
    if (!x || inEx(id)) return;
    MY_EX.push({ exId: id, name: x.n, at: todayStr() });
    writeEx(); refreshEx(id);
    toast(x.n + ' נוסף לאימון שלך');
    try {
      const { data, error } = await sb.rpc('trainee_add_exercise',
        { p_token: TOKEN, p_ex_id: id, p_name: x.n });
      if (error) throw error;
      mergeEx(data);
    } catch (e) {
      toast('נשמר במכשיר. המאמן יראה אחרי שיסיים את ההגדרה.');
    }
  }

  async function exRemove(id) {
    MY_EX = MY_EX.filter(x => x.exId !== id);
    writeEx(); refreshEx(id);
    try {
      const { data, error } = await sb.rpc('trainee_remove_exercise',
        { p_token: TOKEN, p_ex_id: id });
      if (error) throw error;
      mergeEx(data);
    } catch (e) {}
  }

  /* כרטיס אחד ולא ציור מחדש — הגלילה לא זזה */
  function refreshEx(id) {
    const b = document.querySelector('[data-exadd="' + id + '"]');
    if (b) {
      const on = inEx(id);
      b.textContent = on ? '✓ באימון שלי' : '+ הוספה לאימון שלי';
      b.style.background  = on ? 'var(--or-soft)' : 'transparent';
      b.style.color       = on ? 'var(--or)' : 'var(--mut)';
      b.style.borderColor = on ? 'var(--or)' : 'var(--line2)';
    }
    const c = document.getElementById('exCount');
    if (c) c.textContent = MY_EX.length;
  }

  function exButton() {
    if (typeof EBEx === 'undefined') return '';
    return '<button class="btn ghost" style="width:100%;margin-bottom:12px;font-size:14px" '
      + 'onclick="__exOpen()">ספריית התרגילים · ' + EBEx.count
      + (MY_EX.length ? ' · <b style="color:var(--or)">' + MY_EX.length + ' שלי</b>' : '')
      + '</button>';
  }

  /* ספריית התרגילים כחלון מעל מודל האימון, לא מסך נפרד —
     המתאמן נשאר עם תחושת המיקום שלו בתוכנית. */
  function exModal() {
    closeExModal();
    EX_OPEN = true;
    const modal = document.createElement('div');
    modal.className = 'category-modal';
    modal.id = 'exModal';
    modal.style.zIndex = '95';
    modal.innerHTML = '<div class="category-dialog" role="dialog" aria-modal="true">'
      + '<div class="category-dialog-head"><div style="flex:1"><h2>ספריית התרגילים</h2>'
      + '<p>בחר תרגילים להוספה לאימון שלך</p></div>'
      + '<button class="category-close" data-ex-close aria-label="סגירה">×</button></div>'
      + '<div class="category-dialog-body">' + exScreen() + '</div></div>';
    document.body.appendChild(modal);
    document.body.style.overflow = 'hidden';
  }
  function closeExModal() {
    EX_OPEN = false;
    const modal = document.getElementById('exModal');
    if (modal) modal.remove();
    /* אם מודל הקטגוריה עדיין פתוח מתחת, הוא זה שמונע גלילה בגוף */
    if (!document.getElementById('categoryModal')) document.body.style.overflow = '';
  }
  function refreshExModalBody() {
    const body = document.querySelector('#exModal .category-dialog-body');
    if (body) body.innerHTML = exScreen();
  }

  function exScreen() {
    const items = EBEx.search(EX_Q, EX_MUS, 'all');
    const byM = EBEx.byMuscle();
    let h = '<input id="exq" placeholder="חיפוש לפי שם, שריר או ציוד" value="' + esc(EX_Q) + '" '
      + 'oninput="__exSearch(this.value)" style="width:100%;background:var(--card);'
      + 'border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;margin-bottom:10px">'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">'
      + exTag('all', 'הכול', EBEx.count);
    Object.keys(EBEx.MUSCLES).forEach(k => {
      if (byM[k]) h += exTag(k, EBEx.MUSCLES[k], byM[k].length);
    });
    h += '</div><div style="color:var(--mut);font-size:12.5px;margin-bottom:10px">'
      + items.length + ' תרגילים</div>';

    if (!items.length) return h + '<div class="msg">לא נמצא תרגיל מתאים.</div>';

    items.forEach(x => {
      const on = inEx(x.id);
      h += '<div class="card" style="margin-bottom:9px;padding:12px">'
        + '<div style="font-family:Heebo;font-weight:700;font-size:15px;line-height:1.3">'
        + esc(x.n) + '</div>'
        + '<div style="display:flex;gap:6px;margin-top:7px;flex-wrap:wrap">'
        + tag(EBEx.MUSCLES[x.m]) + tag(EBEx.EQUIP[x.e] || 'אחר')
        + tag(x.s + '×' + x.r, 1) + '</div>'
        + (x.note ? '<div style="font-size:12px;color:var(--or);margin-top:7px;line-height:1.5">'
                    + esc(x.note) + '</div>' : '')
        + '<button data-exadd="' + esc(x.id) + '" style="font-size:12.5px;padding:7px 14px;'
        + 'margin-top:10px;border-radius:9px;cursor:pointer;'
        + 'border:1px solid ' + (on ? 'var(--or)' : 'var(--line2)') + ';'
        + 'background:' + (on ? 'var(--or-soft)' : 'transparent') + ';'
        + 'color:' + (on ? 'var(--or)' : 'var(--mut)') + '">'
        + (on ? '✓ באימון שלי' : '+ הוספה לאימון שלי') + '</button></div>';
    });
    return h;
  }

  function exTag(k, label, n) {
    const on = EX_MUS === k;
    return '<button data-exmus="' + k + '" style="font-size:12.5px;padding:6px 12px;'
      + 'border-radius:20px;cursor:pointer;white-space:nowrap;'
      + 'border:1px solid ' + (on ? 'var(--or)' : 'var(--line)') + ';'
      + 'background:' + (on ? 'var(--or-soft)' : 'var(--card)') + ';'
      + 'color:' + (on ? 'var(--or)' : 'var(--mut)') + '">'
      + esc(label) + ' <span style="opacity:.6">' + n + '</span></button>';
  }

  /* מוצג בנפרד מהתוכנית של המאמן, כדי שלא ייווצר רושם שהוא רשם את זה.
     סטים/חזרות/הערה שהמתאמן שינה דורסים את ברירת המחדל של הספרייה. */
  function myExBlock() {
    if (typeof EBEx === 'undefined' || !MY_EX.length) return '';
    const rows = MY_EX.map(m => ({ m: m, x: EBEx.byId(m.exId) })).filter(r => r.x);
    if (!rows.length) return '';
    let h = '<div class="card" style="margin-bottom:12px;border-color:var(--line2)">'
      + '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">'
      + '<div style="flex:1;font-family:Frank Ruhl Libre,serif;font-weight:700;font-size:15px">'
      + 'תרגילים שהוספתי</div>'
      + '<span class="mt" style="font-size:12px">' + rows.length + '</span></div>';
    rows.forEach(r => {
      const s = r.m.s || r.x.s, rr = r.m.r || r.x.r;
      if (EDIT_W) {
        h += '<div style="padding:9px 0;border-top:1px solid var(--line)">'
          + '<div style="display:flex;align-items:center;gap:10px">'
          + '<div style="flex:1;min-width:0">'
          + '<div style="font-size:14px;font-weight:500">' + esc(r.x.n) + '</div>'
          + '<div class="mt" style="font-size:11.5px;margin-top:2px">'
          + esc(EBEx.MUSCLES[r.x.m]) + ' · ' + esc(EBEx.EQUIP[r.x.e] || 'אחר') + '</div></div>'
          + '<button class="delbtn" data-exrm="' + esc(r.x.id) + '" title="הסרה">✕</button></div>'
          + '<div class="editrow">'
          + '<input data-exsf="s" data-exid="' + esc(r.x.id) + '" value="' + esc(r.m.s || '') + '" placeholder="' + esc(r.x.s) + ' סטים">'
          + '<input data-exsf="r" data-exid="' + esc(r.x.id) + '" value="' + esc(r.m.r || '') + '" placeholder="' + esc(r.x.r) + ' חזרות">'
          + '<input data-exsf="note" data-exid="' + esc(r.x.id) + '" value="' + esc(r.m.note || '') + '" placeholder="הערה">'
          + '</div></div>';
        return;
      }
      h += '<div style="padding:9px 0;border-top:1px solid var(--line)">'
        + '<div style="display:flex;align-items:center;gap:10px">'
        + '<div style="flex:1;min-width:0">'
        + '<div style="font-size:14px;font-weight:500">' + esc(r.x.n) + '</div>'
        + '<div class="mt" style="font-size:11.5px;margin-top:2px">'
        + esc(EBEx.MUSCLES[r.x.m]) + ' · ' + esc(EBEx.EQUIP[r.x.e] || 'אחר') + '</div></div>'
        + '<span style="font-family:Heebo;font-weight:700;font-size:13px;white-space:nowrap">'
        + esc(s) + '×' + esc(rr) + '</span>'
        + '<button data-exrm="' + esc(r.x.id) + '" style="background:none;border:0;color:var(--dim);'
        + 'font-size:17px;cursor:pointer;padding:0 4px;line-height:1">✕</button></div>'
        + (r.m.note ? '<div style="font-size:12px;color:var(--or);margin-top:6px;line-height:1.5">' + esc(r.m.note) + '</div>' : '')
        + '</div>';
    });
    return h + '</div>';
  }

  function libCard(m) {
    const c = EBLib.calc(m.items), t = c.total, open = !!LIB_ROW[m.id];
    let h = '<div class="card" style="margin-bottom:10px" data-mid="' + esc(m.id) + '">'
      + '<div style="display:flex;align-items:flex-start;gap:10px">'
      + '<div style="flex:1;min-width:0">'
      + '<div style="font-family:Heebo;font-weight:700;font-size:15.5px;line-height:1.3">' + esc(m.name) + '</div>'
      + '<div style="color:var(--dim);font-size:12px;margin-top:3px">' + esc(EBLib.TYPES[m.type]||'') + '</div></div>'
      + '<div style="text-align:center;flex:none">'
      + '<div style="font-family:Heebo;font-weight:900;font-size:21px;color:var(--or);line-height:1">' + Math.round(t.k) + '</div>'
      + '<div style="color:var(--dim);font-size:10.5px">קק״ל</div></div></div>'
      + '<div style="display:flex;gap:6px;margin-top:9px;flex-wrap:wrap">'
      + tag('חלבון ' + r1(t.p)) + tag('פחמימות ' + r1(t.c)) + tag('שומן ' + r1(t.f)) + '</div>'
      + (EBLib.kosherOf(m) !== 'ok'
          ? '<div style="font-size:11.5px;color:#D9605A;margin-top:8px;font-weight:600">⚠ '
            + esc(EBLib.kosherLabel(EBLib.kosherOf(m))) + '</div>' : '')
      + (m.note ? '<div style="font-size:12px;color:var(--or);margin-top:8px;line-height:1.5">' + esc(m.note) + '</div>' : '')
      + '<button class="btn ghost" style="font-size:12.5px;padding:7px 14px;margin-top:10px" '
      + 'data-lr="' + esc(m.id) + '">' + (open ? 'סגירת הפירוט' : 'פירוט לגרם') + '</button>'
      + '<button data-my="' + esc(m.id) + '" style="font-size:12.5px;padding:7px 14px;'
      + 'margin-top:10px;margin-inline-start:7px;border-radius:9px;cursor:pointer;'
      + 'border:1px solid ' + (inMy(m.id) ? 'var(--or)' : 'var(--line2)') + ';'
      + 'background:' + (inMy(m.id) ? 'var(--or-soft)' : 'transparent') + ';'
      + 'color:' + (inMy(m.id) ? 'var(--or)' : 'var(--mut)') + '">'
      + (inMy(m.id) ? '✓ בתפריט שלי' : '+ הוספה לתפריט שלי') + '</button>';

    if (open) {
      h += '<div data-mtbl style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px">'
        + '<thead><tr>' + lth('רכיב','right') + lth('גרם') + lth('קק״ל') + lth('חלבון') + lth('פחמ׳') + lth('שומן') + '</tr></thead><tbody>';
      c.rows.forEach(r => {
        h += '<tr>' + ltd(esc(r.name),'right') + ltd(r.g) + ltd(Math.round(r.k))
           + ltd(r1(r.p)) + ltd(r1(r.c)) + ltd(r1(r.f)) + '</tr>';
      });
      h += '<tr style="border-top:2px solid var(--or)">'
        + ltd('<b>סה״כ</b>','right') + ltd('<b>'+t.g+'</b>') + ltd('<b>'+Math.round(t.k)+'</b>')
        + ltd('<b>'+r1(t.p)+'</b>') + ltd('<b>'+r1(t.c)+'</b>') + ltd('<b>'+r1(t.f)+'</b>')
        + '</tr></tbody></table></div>';
    }
    return h + '</div>';
  }
  function lth(x,a){ return '<th style="text-align:'+(a||'left')+';padding:5px 4px;border-bottom:1px solid var(--line);font-size:11px;color:var(--mut);font-weight:500;white-space:nowrap">'+x+'</th>'; }
  function ltd(x,a){ return '<td style="text-align:'+(a||'left')+';padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums">'+x+'</td>'; }

  /* ---------- עריכת האימון ----------
     פתיחה יוצרת תצלום — ביטול מחזיר אותו, שמירה דוחפת לשרת. */
  function editBar() {
    return '<div class="editbar">'
      + (EDIT_W
          ? '<button class="btn" onclick="__saveW()">✓ שמירת השינויים</button>'
          + '<button class="btn ghost" onclick="__cancelW()">ביטול</button>'
          : '<button class="btn ghost" onclick="__editW()">✏️ עריכת התוכנית שלי</button>')
      + '</div>'
      + traineeNoteBox();
  }

  /* ההערה של המתאמן עצמו — נפרדת לגמרי מזו של המאמן, ונשמרת
     בשדה משלה. במצב עריכה היא ניתנת לכתיבה, ואחרת מוצגת כפתק. */
  function traineeNoteBox() {
    const v = (DATA.program && DATA.program.traineeNote) || '';
    if (!EDIT_W) {
      if (!String(v).trim()) return '';
      return '<div class="card tnote-mine" style="margin-bottom:12px">'
        + '<div style="font-family:Heebo;font-weight:700;font-size:13px;color:var(--cop);'
        + 'margin-bottom:4px">📝 ההערה שלי</div>'
        + '<div style="font-size:13px;line-height:1.7;white-space:pre-wrap">' + esc(v) + '</div></div>';
    }
    return '<div class="card" style="margin-bottom:12px">'
      + '<div style="font-family:Heebo;font-weight:700;font-size:13px;margin-bottom:6px">'
      + '📝 הערה שלי למאמן</div>'
      + '<textarea id="tn_box" rows="3" maxlength="2000" '
      + 'style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;'
      + 'padding:10px;font:inherit;color:inherit;resize:vertical;line-height:1.6" '
      + 'placeholder="למשל: כאב לי הכתף בלחיצה, החלפתי למכונה">' + esc(v) + '</textarea>'
      + '<div class="mt" style="font-size:11.5px;margin-top:6px">'
      + 'נשמרת עם שאר השינויים, והמאמן רואה אותה.</div></div>';
  }

  function refreshWorkoutBody() {
    if (OPEN_CATEGORY !== 'workout') return;
    const body = document.querySelector('#categoryModal .category-dialog-body');
    if (body) body.innerHTML = categoryContent('workout');
  }

  window.__editW = () => {
    if (!DATA.program) DATA.program = { days: [] };
    if (!Array.isArray(DATA.program.days)) DATA.program.days = [];
    EDIT_SNAP    = JSON.parse(JSON.stringify(DATA.program));
    EDIT_EX_SNAP = JSON.parse(JSON.stringify(MY_EX));
    EDIT_W = true;
    refreshWorkoutBody();
  };
  window.__cancelW = () => {
    if (EDIT_SNAP) DATA.program = EDIT_SNAP;
    if (EDIT_EX_SNAP) { MY_EX = EDIT_EX_SNAP; writeEx(); }
    EDIT_W = false; EDIT_SNAP = EDIT_EX_SNAP = null;
    refreshWorkoutBody();
  };
  window.__saveW = async () => {
    if (!EDIT_W) return;
    try {
      const r = await sb.rpc('trainee_update_program', { p_token: TOKEN, p_program: DATA.program });
      if (r.error) throw r.error;
      if (r.data) DATA.program = r.data;
      const r2 = await sb.rpc('trainee_update_exercises', { p_token: TOKEN, p_exercises: MY_EX });
      if (r2.error) throw r2.error;
      if (Array.isArray(r2.data)) { MY_EX = r2.data; writeEx(); }

      /* ההערה נשמרת בקריאה נפרדת: trainee_update_program כותב אך ורק
         את program.days, וכל שדה אחר שיישלח אליו פשוט לא ייכתב. */
      const box = document.getElementById('tn_box');
      if (box) {
        const r3 = await sb.rpc('trainee_update_note', { p_token: TOKEN, p_note: box.value });
        if (!r3.error && r3.data) DATA.program = r3.data;
      }
      writeCache(DATA);
      EDIT_W = false; EDIT_SNAP = EDIT_EX_SNAP = null;
      paint(); refreshWorkoutBody();
      toast('נשמר — המאמן יראה את העדכון');
    } catch (e) {
      /* שגיאה שמזכירה פונקציה חסרה = ה-SQL של העריכה לא הורץ בשרת */
      const m = String((e && (e.message || e.details)) || '');
      if (/trainee_update_program|trainee_update_exercises|PGRST202|42883/i.test(m)) {
        toast('חסר עדכון בשרת — יש להריץ את supabase/trainee-edit.sql');
      } else {
        toast('לא הצלחנו לשמור — נסה שוב כשתהיה רשת');
      }
    }
  };

  /* אחרי מחיקת תרגיל או יום האינדקסים זזים — מזיזים גם את סימוני הביצוע,
     ולא משאירים וי על התרגיל הלא נכון */
  function shiftStateEx(d, from) {
    const n = ((DATA.program.days || [])[d] || {}).exercises || [];
    delete STATE[d + ':' + from];
    for (let i = from + 1; i <= n.length; i++) {
      const k = d + ':' + i;
      if (STATE[k]) { STATE[d + ':' + (i - 1)] = STATE[k]; delete STATE[k]; }
    }
  }
  function shiftStateDay(from) {
    const next = {};
    Object.keys(STATE).forEach(k => {
      const di = +k.split(':')[0], rest = k.split(':')[1];
      if (di === from) return;
      next[(di > from ? di - 1 : di) + ':' + rest] = STATE[k];
    });
    STATE = next;
  }

  window.__exOpen   = () => { EX_Q=''; EX_MUS='all'; exModal(); };
  window.__exClose  = () => { closeExModal(); };
  window.__exSearch = v => { EX_Q = v; refreshExModalBody();
                             const el = document.getElementById('exq');
                             if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } };

  window.__libOpen   = (type) => { LIB_OPEN = true; LIB_TAB = 'meals';
    /* נפתחת מסוננת לתא שממנו נלחצה — מתאמן שלחץ 'הוספה לבוקר'
       לא צריך לחפש שוב בין 400 ארוחות. */
    LIB_TYPE = (typeof type === 'string' && type && type !== 'other') ? type : 'all';
    screen(libScreen()); window.scrollTo(0,0); };
  /* בלי תוכנית טעונה אין למה לחזור — paint() קורא מ-DATA ונופל.
     קורה אם הטוקן בוטל או שהמטמון נוקה בזמן שהספרייה פתוחה. */
  window.__libClose  = () => {
    LIB_OPEN = false;
    if (DATA) paint(); else loginScreen();
    window.scrollTo(0,0);
  };
  window.__libSearch = v => { LIB_Q = v; screen(libScreen());
                              const el = document.getElementById('lq');
                              if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } };
  /* מאזין אחד במקום onclick מוטבע: הזרקת מזהה לתוך מחרוזת בתוך
     מאפיין HTML נשברת בקלות על ציטוטים, וזה בדיוק מה שקרה כאן. */
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-lt]');
    if (t) { LIB_TYPE = t.dataset.lt; screen(libScreen()); return; }
    var sl = e.target.closest('[data-slot]');
    if (sl) { var i = +sl.dataset.slot; SLOT = (SLOT === i ? -1 : i); paint(); return; }
    const ba = e.target.closest('[data-badd]');
    if (ba) {
      const n = ba.dataset.badd;
      const i = BUILD.findIndex(x => x.n === n);
      if (i > -1) BUILD.splice(i, 1); else BUILD.push({ n: n, g: 100 });
      writeBuild(); screen(libScreen());
      return;
    }
    const brm = e.target.closest('[data-brm]');
    if (brm) { BUILD.splice(+brm.dataset.brm, 1); writeBuild(); screen(libScreen()); return; }
    if (e.target.closest('[data-bclear]')) { BUILD = []; writeBuild(); screen(libScreen()); return; }
    if (e.target.closest('[data-bsave]')) { saveBuild(); return; }

    const ea = e.target.closest('[data-exadd]');
    if (ea) { const id = ea.dataset.exadd; inEx(id) ? exRemove(id) : exAdd(id); return; }
    const er = e.target.closest('[data-exrm]');
    if (er) { exRemove(er.dataset.exrm); refreshWorkoutBody(); return; }

    const xd = e.target.closest('[data-exdel]');
    if (xd) {
      const dd2 = +xd.dataset.exdeld, xi = +xd.dataset.exdel;
      const day = (DATA.program.days || [])[dd2];
      if (!day || !day.exercises[xi]) return;
      if (!confirm('להסיר את "' + (day.exercises[xi].name || 'התרגיל') + '" מהיום הזה?')) return;
      day.exercises.splice(xi, 1);
      shiftStateEx(dd2, xi);
      refreshWorkoutBody();
      return;
    }
    const dy = e.target.closest('[data-daydel]');
    if (dy) {
      const dd3 = +dy.dataset.daydel;
      const day = (DATA.program.days || [])[dd3];
      if (!day) return;
      if (!confirm('למחוק את "' + (day.name || 'היום') + '" וכל התרגילים שבו?')) return;
      DATA.program.days.splice(dd3, 1);
      shiftStateDay(dd3);
      refreshWorkoutBody();
      return;
    }
    if (e.target.closest('[data-dayadd]')) {
      DATA.program.days.push({ name: 'יום ' + (DATA.program.days.length + 1), exercises: [] });
      refreshWorkoutBody();
      return;
    }

    const em = e.target.closest('[data-exmus]');
    if (em) { EX_MUS = em.dataset.exmus; refreshExModalBody(); return; }
    if (e.target.closest('[data-ex-close]')) { closeExModal(); return; }

    const lt = e.target.closest('[data-libtab]');
    if (lt) { LIB_TAB = lt.dataset.libtab; screen(libScreen()); window.scrollTo(0,0); return; }

    const my = e.target.closest('[data-my]');
    if (my) { const id = my.dataset.my; inMy(id) ? myRemove(id) : myAdd(id); return; }

    const rm = e.target.closest('[data-myrm]');
    if (rm) { myRemove(rm.dataset.myrm); paint(); return; }

    const r = e.target.closest('[data-lr]');
    if (r) {
      /* פתיחת פירוט משנה כרטיס אחד. ציור מחדש של כל הרשימה החזיר
         את הגלילה לראש המסך — אחרי ארוחה עשרים זה אומר לגלול הכול
         שוב. הטבלה נכנסת ויוצאת במקום. */
      const id = r.dataset.lr;
      LIB_ROW[id] = !LIB_ROW[id];
      const cardEl = r.closest('[data-mid]');
      const meal = EBLib.byId(id);
      if (!cardEl || !meal) { screen(libScreen()); return; }
      const tbl = cardEl.querySelector('[data-mtbl]');
      if (LIB_ROW[id]) {
        if (!tbl) {
          const tmp = document.createElement('div');
          tmp.innerHTML = libCard(meal);
          const fresh = tmp.querySelector('[data-mtbl]');
          if (fresh) cardEl.appendChild(fresh);
        }
        r.textContent = 'סגירת הפירוט';
      } else {
        if (tbl) tbl.remove();
        r.textContent = 'פירוט לגרם';
      }
    }
  });

  /* ---------- היעדים ---------- */
  /* עוטף: אם progress.js לא נטען משום סיבה, הדף ממשיך לעבוד בלעדיו */
  function exBlockSafe() {
    try { return myExBlock(); } catch (e) { return ''; }
  }

  function progBlock() {
    try { return window.EBProg ? EBProg.block(DATA) : ''; }
    catch (e) { return ''; }
  }

  function goalsBlock(d) {
    var rows = [['המטרה', d.goal], ['מטרה משנית', d.goal2], ['הצלחה ב-3 חודשים', d.success3m]]
      .filter(function (r) { return r[1]; });
    if (!rows.length) return '';
    return '<div class="card" style="margin-bottom:12px">'
      + '<div style="font-size:13px;color:var(--mut);margin-bottom:8px">היעדים שלך</div>'
      + rows.map(function (r) {
          return '<div style="display:flex;gap:10px;padding:6px 0;align-items:baseline">'
            + '<span style="color:var(--mut);font-size:12.5px;min-width:110px">' + esc(r[0]) + '</span>'
            + '<span style="flex:1;font-size:14.5px">' + esc(r[1]) + '</span></div>';
        }).join('')
      + '</div>';
  }

  // קבצים שהמאמן צירף. נפתחים בלשונית חדשה — באייפון זה מעביר
  // לצפיין המובנה, שם אפשר גם לשמור לקבצים או להדפיס.
  function filesBlock(files) {
    if (!files || !files.length) return '';
    var ic = function (n) {
      var e = (String(n).split('.').pop() || '').toLowerCase();
      if (e === 'pdf') return '📄';
      if (['png','jpg','jpeg','webp','heic'].indexOf(e) > -1) return '🖼';
      if (e === 'xlsx') return '📊';
      if (e === 'docx') return '📝';
      return '📎';
    };
    return '<div class="card" style="margin-bottom:12px">'
      + '<div style="font-size:13px;color:var(--mut);margin-bottom:8px">קבצים מהמאמן</div>'
      + files.map(function (f) {
          return '<a href="' + esc(f.url) + '" target="_blank" rel="noopener" '
            + 'style="display:flex;align-items:center;gap:10px;padding:10px 0;color:var(--tx);'
            + 'border-top:1px solid var(--line)">'
            + '<span style="font-size:19px">' + ic(f.name) + '</span>'
            + '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
            + esc(f.name) + '</span>'
            + '<span style="color:var(--or);font-size:13px;white-space:nowrap">פתיחה ›</span></a>';
        }).join('')
      + '</div>';
  }
  function readCache() { try { return JSON.parse(localStorage.getItem(CACHE)); } catch (e) { return null; } }
  function writeCache(d) { try { localStorage.setItem(CACHE, JSON.stringify(d)); } catch (e) {} }

  /* ---------- תצוגה ---------- */
  function paint() {
    $('#hTitle').textContent = DATA.name || 'התוכנית שלי';
    $('#hSub').textContent = [DATA.goal, DATA.trainer_name && 'מאמן: ' + DATA.trainer_name]
      .filter(Boolean).join(' · ');

    const days  = (DATA.program && DATA.program.days) || [];
    const files = DATA.files || [];

    screen(
        openerBlock(days)
      + journeyBlockSafe()
      + categoryBlock()
      + statsBlock(days)
      + footerBlock()
    );
    bar();
  }

  function categoryContent(key) {
    const days=(DATA.program&&DATA.program.days)||[], files=DATA.files||[];
    if(key==='workout') return editBar()+planBlock(days)+exBlockSafe()+exButton();
    if(key==='food') return targetsBlock()+nutritionPlan()+libButton();
    if(key==='body') return botBody()+bodyMetricsBlock()+targetsBlock()+healthAlert()+healthFolder()+filesBlock(files);
    return botBlock({skipWeight:true})+progBlock()+historyBlock(days);
  }
  function historyBlock(days) {
    const done=days.reduce((n,d,i)=>n+(d.exercises||[]).filter((_,j)=>(STATE[i+':'+j]||{}).done).length,0);
    return '<div class="card"><div style="font-size:13px;color:var(--mut);margin-bottom:8px">מעקב כללי</div>'
      +'<div style="display:flex;gap:12px;flex-wrap:wrap;font-size:13px">'
      +'<span>ימי תוכנית <b>'+days.length+'</b></span><span>תרגילים שבוצעו <b>'+done+'</b></span>'
      +'</div></div>';
  }
  function bodyMetricsBlock() {
    const bmi=bodyBmi();
    if(!bmi && !DATA.height && !DATA.weight) return '';
    return '<div class="card" style="border-color:var(--line2)"><div style="font-size:13px;color:var(--mut);margin-bottom:10px">מדד מסת הגוף</div>'
      +(bmi?'<div style="display:flex;align-items:baseline;gap:9px"><strong style="font-family:Heebo;font-size:32px;color:var(--or)">'+bmi.value+'</strong><span style="font-size:14px">BMI · '+bmi.label+'</span></div><div class="mt" style="font-size:12px;margin-top:6px">מחושב לפי משקל וגובה עדכניים: '+DATA.weight+' ק״ג · '+DATA.height+' ס״מ</div>'
          :'<div style="font-size:13px;color:var(--mut)">נדרש משקל וגובה כדי לחשב BMI.</div>')+'</div>';
  }
  let OPEN_CATEGORY = null;
  function openCategory(key) {
    const labels={workout:['אימון','התוכנית והביצוע'],food:['תזונה','התפריט והיעדים שלך'],body:['גוף','מדדים, בריאות וקבצים'],follow:['מעקב','ההתקדמות שלך']};
    const item=labels[key]||labels.workout;
    closeCategory();
    OPEN_CATEGORY = key;
    const modal=document.createElement('div'); modal.className='category-modal'; modal.id='categoryModal';
    modal.innerHTML='<div class="category-dialog" role="dialog" aria-modal="true"><div class="category-dialog-head"><div style="flex:1"><h2>'+item[0]+'</h2><p>'+item[1]+'</p></div><button class="category-close" data-category-close aria-label="סגירה">×</button></div><div class="category-dialog-body">'+categoryContent(key)+'</div></div>';
    document.body.appendChild(modal); document.body.style.overflow='hidden';
  }
  /* סגירה באמצע עריכה משמיטה את השינויים שלא נשמרו — כמו ביטול */
  function closeCategory(){
    if (EDIT_W) {
      if (EDIT_SNAP) DATA.program = EDIT_SNAP;
      if (EDIT_EX_SNAP) { MY_EX = EDIT_EX_SNAP; writeEx(); }
      EDIT_W = false; EDIT_SNAP = EDIT_EX_SNAP = null;
    }
    OPEN_CATEGORY = null;
    const modal=document.getElementById('categoryModal');
    if(modal) modal.remove();
    document.body.style.overflow='';
  }

  /* פתיח: משפט אחד שאומר מה יש כאן. בלעדיו הדף נפתח באמצע עניין
     ולא ברור אם זו התוכנית המלאה או קטע ממנה. */
  function openerBlock(days) {
    const first = (DATA.name || '').trim().split(/\s+/)[0] || '';
    const ex    = days.reduce((a, d) => a + ((d.exercises || []).length), 0);
    const meals = (DATA.meals || []).length;
    const t     = (DATA.program && DATA.program.targets) || null;
    const done = days.reduce((a, d, i) => a + (d.exercises || []).filter((_, j) => (STATE[i + ':' + j] || {}).done).length, 0);
    const pct = ex ? Math.round(done / ex * 100) : 0;
    const chips = [];
    if (DATA.goal) chips.push('<span class="hero-chip">' + esc(DATA.goal) + '</span>');
    if (t && t.kcal) chips.push('<span class="hero-chip">' + Number(t.kcal).toLocaleString('en-US') + ' קק״ל ביום</span>');
    const hour=new Date().getHours();
    const greeting=hour<5?'לילה טוב':hour<12?'בוקר טוב':hour<18?'צהריים טובים':'ערב טוב';
    return '<section class="hero">'
      + '<div class="hero-kicker">המרחב האישי שלך · E.B FIT</div>'
      + '<h2>' + (first ? greeting + ', ' + esc(first) : 'התוכנית שלך מוכנה') + '</h2>'
      + '<p>' + (pct ? 'המשכת קדימה. כל ביצוע קטן מצטבר לתוצאה גדולה.' : 'כאן נמצאים האימונים, היעדים והכלים שלך במקום אחד.') + '</p>'
      + '<div class="hero-meta">' + chips.join('') + (pct ? '<span class="hero-chip">' + pct + '% מהשבוע הושלם</span>' : '') + '</div>'
      + '</section>';
  }

  function categoryBlock() {
    return '<div class="section-head"><h3>המרחב שלך</h3><span>בחר קטגוריה</span></div>'
      + '<div class="category-grid">'
      + categoryTile('workout','אימון','התוכנית והביצוע')
      + categoryTile('food','תזונה','ארוחות ויעדים')
      + categoryTile('body','גוף','מדדים ובריאות')
      + categoryTile('follow','מעקב','התקדמות והרגלים')
      + '</div>';
  }
  function categoryIcon(key) {
    const paths={
      workout:'<path d="M6 8v8M10 6v12M14 6v12M18 8v8M3 10h18M3 14h18"/>',
      food:'<path d="M5 3v8M8 3v8M5 7h3M6.5 11v10M15 3v18M15 3c3 2 4 5 4 8h-4"/>',
      body:'<circle cx="12" cy="5" r="2.5"/><path d="M8 21l1.5-7L7 11l2-3 3 2 3-2 2 3-2.5 3 1.5 7M9.5 14h5"/>',
      follow:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.5 2M8.5 3.5l-2-2M15.5 3.5l2-2"/>'
    };
    return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+paths[key]+'</g></svg>';
  }
  function categoryTile(key, title, sub) {
    return '<button class="category-tile" data-category="'+key+'"><span class="category-icon">'+categoryIcon(key)+'</span><strong>'+title+'</strong><span>'+sub+'</span></button>';
  }
  function statsBlock(days) {
    const exercises=days.reduce((n,d)=>n+(d.exercises||[]).length,0);
    const done=days.reduce((n,d,i)=>n+(d.exercises||[]).filter((_,j)=>(STATE[i+':'+j]||{}).done).length,0);
    const meals=(DATA.meals||[]).length;
    const pct=exercises?Math.round(done/exercises*100):0;
    const bmi=bodyBmi();
    return '<div class="section-head"><h3>הסטטיסטיקות שלך</h3><span>תמונת מצב</span></div><div class="overview">'
      +'<div class="overview-card"><strong>'+pct+'%</strong><span>השלמת התוכנית</span></div>'
      +'<div class="overview-card"><strong>'+done+'</strong><span>תרגילים שבוצעו</span></div>'
      +'<div class="overview-card"><strong>'+(bmi?bmi.value:'—')+'</strong><span>'+(bmi?'BMI · '+bmi.label:'BMI ללא נתונים')+'</span></div></div>';
  }
  function bodyBmi() {
    const h=Number(DATA.height), w=Number(DATA.weight);
    if(!(h>0&&w>0)) return null;
    const value=Math.round((w/Math.pow(h/100,2))*10)/10;
    return {value:value,label:value<18.5?'תת-משקל':value<25?'תקין':value<30?'עודף משקל':value<35?'השמנה דרגה 1':value<40?'השמנה דרגה 2':'השמנה דרגה 3'};
  }

  /* היעדים המחושבים. מגיעים בתוך התוכנית כי הם נגזרים ממדידות
     שהמאמן לקח, ואין להם מקום משלהם בשליפה. */
  function targetsBlock() {
    const t = (DATA.program && DATA.program.targets) || null;
    if (!t || !t.kcal) return '';
    const n = v => (v == null || v === '') ? null : v;
    const cell = (label, val, unit) => !n(val) ? '' :
      '<div style="flex:1;min-width:74px">'
      + '<div style="font-family:Heebo;font-weight:700;font-size:19px;line-height:1;'
      + 'font-variant-numeric:tabular-nums;color:var(--cop)">' + val
      + (unit ? '<span style="font-size:11px;font-weight:400;color:var(--mut)"> ' + unit + '</span>' : '')
      + '</div><div class="mt" style="font-size:11px;margin-top:3px">' + label + '</div></div>';

    return '<div class="card" style="margin-bottom:12px">'
      + '<div style="font-family:Frank Ruhl Libre,serif;font-weight:700;font-size:15px;margin-bottom:11px">'
      + 'היעדים היומיים שלך</div>'
      + '<div style="display:flex;gap:12px;flex-wrap:wrap">'
      + cell('קלוריות', t.kcal && t.kcal.toLocaleString('en-US'), '')
      + cell('חלבון', t.protein, 'ג׳')
      + cell('פחמימות', t.carbs, 'ג׳')
      + cell('שומן', t.fat, 'ג׳')
      + cell('מים', t.water, 'ליטר')
      + cell('צח״מ', t.vo2, '')
      + '</div></div>';
  }

  /* כל הימים פרושים כתיקיות, ולא רצועת לשוניות שמראה יום אחד. כך
     נראית התוכנית כולה במבט אחד, ואפשר לפתוח את מה שמתאמנים היום. */
  /* ---------- הערות המאמן ----------
     נכתבות אצל המאמן ונשמרות בתוך program, ולכן הן מגיעות לכאן
     באותה שליפה של התוכנית ובלי קריאה נוספת ובלי עמודה חדשה. */
  function trainerNote(txt, title) {
    if (!txt || !String(txt).trim()) return '';
    return '<div class="card" style="margin-bottom:12px;border-color:var(--or);'
      + 'background:var(--or-soft)">'
      + '<div style="font-family:Heebo;font-weight:700;font-size:13.5px;color:var(--or);'
      + 'margin-bottom:5px">' + esc(title) + '</div>'
      + '<div style="font-size:13.5px;line-height:1.7;white-space:pre-wrap">'
      + esc(txt) + '</div></div>';
  }

  function planBlock(days) {
    if (!days.length && !EDIT_W) return '';
    let h = trainerNote((DATA.program || {}).note, 'הערה מהמאמן')
      + '<div class="section-head"><h3>תוכנית האימון</h3><span>' + days.length + ' ימים · ' + days.reduce((n, d) => n + (d.exercises || []).length, 0) + ' תרגילים</span></div>';

    days.forEach((d, i) => {
      const ex   = d.exercises || [];
      const open = EDIT_W ? true : DAY === i;
      const done = ex.filter((_, j) => (STATE[i + ':' + j] || {}).done).length;
      const full = ex.length > 0 && done === ex.length;
