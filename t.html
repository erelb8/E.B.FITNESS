<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>התוכנית שלי</title>

<!-- הדף הזה מכוון למתאמן. בכוונה אין כאן link למניפסט של המאמן,
     כדי שהוספה למסך הבית תיצור אצלו קיצור לתוכנית שלו ולא לאפליקציית הניהול. -->
<meta name="theme-color" content="#221A12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="התוכנית שלי">
<meta name="robots" content="noindex,nofollow">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Heebo:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* זהה לאפליקציית הניהול, כדי שהמתאמן יראה אותו מותג */
  --ink:#221A12; --card:#34281E; --line:#48392B; --line2:#5F4C39;
  --tx:#F2E8D8; --mut:#B3A48E; --dim:#7E7060;
  --or:#8FA84F; --or-soft:rgba(143,168,79,.15);
  --cop:#D19A55;
  --ok:#A8C75E; --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--tx);
  font-family:'Heebo',system-ui,sans-serif; font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(860px 480px at 88% -12%, rgba(143,168,79,.11), transparent 62%),
    radial-gradient(720px 440px at 6% 104%, rgba(209,154,85,.08), transparent 60%);
  background-attachment:fixed;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
}
h1,h2,h3{font-family:'Frank Ruhl Libre',Georgia,serif;margin:0;font-weight:700;letter-spacing:-.02em}
button,input{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}

.top{
  position:sticky;top:0;z-index:20;background:rgba(12,12,14,.9);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
}
.brand{font-family:'Heebo';font-weight:900;font-size:12px;letter-spacing:.14em;color:var(--dim)}
.brand .dot{width:6px;height:6px;border-radius:50%;background:var(--or);display:inline-block}
.top h1{font-size:22px;margin-top:3px}
.top .sub{color:var(--mut);font-size:13px;margin-top:2px}

.wrap{padding:16px 14px 0;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}

.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch}
.days button{
  flex:0 0 auto;background:var(--card);border:1px solid var(--line);color:var(--mut);
  padding:8px 15px;border-radius:10px;font-weight:500;white-space:nowrap;
}
.days button.on{background:var(--or-soft);border-color:var(--or);color:var(--or);font-weight:700}

/* ---- יום אימון כתיקייה ---- */
.dayc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.dayc.on{border-color:var(--line2)}
.dayc.full{border-color:rgba(168,199,94,.4)}
.dayh{width:100%;background:none;border:0;padding:13px 14px;display:flex;align-items:center;gap:12px;text-align:right}
.daynum{
  width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;
  font-family:'Heebo';font-weight:800;font-size:13px;
  background:var(--or-soft);color:var(--or);border:1px solid rgba(143,168,79,.32);
}
.dayc.on .daynum{background:var(--or);color:#141A06;border-color:var(--or)}
.dayc.full .daynum{background:var(--ok);color:#0D1503;border-color:var(--ok)}
.dayt{flex:1;min-width:0}
.dayn{display:block;font-family:'Frank Ruhl Libre',Georgia,serif;font-weight:700;font-size:16px;line-height:1.25}
.daym{display:block;color:var(--dim);font-size:12px;margin-top:3px}
.daym em{font-style:normal;color:var(--or);font-weight:700}
.daychev{
  width:8px;height:8px;flex:none;transform:rotate(45deg);transition:transform .22s;
  border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);
}
.dayc.on .daychev{transform:rotate(-135deg)}
.dayb{display:none;padding:0 12px 4px}
.dayc.on .dayb{display:block}

.ex{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--card);transition:border-color .15s}
.ex.done{border-color:rgba(168,199,94,.45);background:rgba(168,199,94,.05)}
.ex .hd{display:flex;align-items:flex-start;gap:11px}
.ex .nm{font-weight:700;font-size:16px;flex:1;min-width:0;line-height:1.3}
.ex .meta{color:var(--mut);font-size:13px;margin-top:3px}
.ex .note{color:var(--or);font-size:12.5px;margin-top:6px}
.chk{
  flex:0 0 auto;width:30px;height:30px;border-radius:9px;border:2px solid var(--line2);
  background:none;display:grid;place-items:center;font-size:16px;color:transparent;transition:.15s
}
.ex.done .chk{background:var(--ok);border-color:var(--ok);color:#141A06}
.logs{display:flex;gap:8px;margin-top:11px}
.logs input{
  flex:1;min-width:0;background:var(--ink);border:1px solid var(--line);border-radius:9px;
  padding:9px 10px;font-size:15px;text-align:center
}
.logs input::placeholder{color:var(--dim);font-size:13px}

.bar{
  position:fixed;bottom:0;right:0;left:0;z-index:30;
  background:rgba(18,18,21,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:11px 14px calc(11px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:12px
}
.bar .prog{flex:1;font-size:13px;color:var(--mut)}
.bar .prog b{color:var(--tx);font-family:'Heebo'}
.btn{background:var(--or);color:#141A06;border:0;border-radius:10px;padding:12px 20px;font-weight:700;font-family:'Heebo';font-size:15px}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--card);color:var(--tx);border:1px solid var(--line)}

.mt{color:var(--mut)}
.mt b{color:var(--tx);font-family:'Heebo'}
.msg{text-align:center;padding:56px 24px;color:var(--mut)}
.msg h2{color:var(--tx);margin-bottom:8px;font-size:19px}
.spin{width:26px;height:26px;border:3px solid var(--line);border-top-color:var(--or);border-radius:50%;margin:0 auto 16px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.feel{display:flex;gap:8px;margin-top:10px}
.feel button{flex:1;background:var(--ink);border:1px solid var(--line);color:var(--mut);padding:10px;border-radius:10px;font-size:14px}
.feel button.on{border-color:var(--or);color:var(--or);background:var(--or-soft)}
#toast{
  position:fixed;bottom:calc(86px + env(safe-area-inset-bottom));right:50%;transform:translate(50%,14px);
  background:#25252E;border:1px solid var(--line2);padding:11px 18px;border-radius:11px;
  opacity:0;pointer-events:none;transition:.25s;z-index:60;font-size:14px;max-width:90vw;text-align:center
}
#toast.on{opacity:1;transform:translate(50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">E.B<span class="dot"></span>FIT</div>
  <h1 id="hTitle">טוען…</h1>
  <div class="sub" id="hSub"></div>
</header>

<div class="wrap" id="wrap">
  <div class="msg"><div class="spin"></div>מביא את התוכנית שלך…</div>
</div>

<div id="toast"></div>

<script src="vendor/supabase.js?v=v69"></script>
<script src="config.js?v=v69"></script>
<script src="meal-library.js?v=v69"></script>
<script src="exercise-library.js?v=v69"></script>
<script src="progress.js?v=v69"></script>
<script src="health.js?v=v69"></script>
<script src="privacy.js?v=v69"></script>
<script>
(function () {
  'use strict';
  const CFG   = window.EBFIT_CONFIG || {};
  let TOKEN = location.hash.replace(/^#/, '').trim();
  let CACHE = 'ebfit_t_' + TOKEN.slice(0, 12);

  const $  = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s)
    .replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  let DATA = null, DAY = 0, STATE = {}, FEEL = null, sb = null;

  /* הארוחות שהמתאמן בחר לעצמו. נשמרות גם במכשיר וגם בשרת: המכשיר
     כדי שההוספה תהיה מיידית וגם בלי רשת, והשרת כדי שהמאמן יראה. */
  let MY_MEALS = [];

  /* התרגילים שהמתאמן בחר לעצמו. נשמרים במכשיר ובשרת, כמו הארוחות —
     המכשיר לתגובה מיידית וגם בלי רשת, השרת כדי שהמאמן יראה. */
  let MY_EX = [], EX_OPEN = false, EX_Q = '', EX_MUS = 'all';
  const exKey = () => 'ebfit_myex_' + String(TOKEN || '').slice(0, 12);
  function readEx() { try { return JSON.parse(localStorage.getItem(exKey())) || []; } catch (e) { return []; } }
  function writeEx() { try { localStorage.setItem(exKey(), JSON.stringify(MY_EX)); } catch (e) {} }
  const inEx = id => MY_EX.some(x => x.exId === id);
  const myKey = () => 'ebfit_my_' + String(TOKEN || '').slice(0, 12);
  function readMy() { try { return JSON.parse(localStorage.getItem(myKey())) || []; } catch (e) { return []; } }
  function writeMy() { try { localStorage.setItem(myKey(), JSON.stringify(MY_MEALS)); } catch (e) {} }
  const inMy = id => MY_MEALS.some(x => x.libId === id);

  function toast(m) {
    const t = $('#toast'); t.textContent = m; t.classList.add('on');
    clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2400);
  }
  function screen(html) {
    $('#wrap').innerHTML = html;
    // בלי תוכנית טעונה הכותרת לא צריכה להישאר על "טוען…"
    if (!DATA) { $('#hTitle').textContent = 'התוכנית שלי'; $('#hSub').textContent = ''; }
  }

  /* ---------- טעינה ---------- */
  async function boot() {
    if (!CFG.URL || !CFG.ANON) return screen(msg('המערכת עוד לא מחוברת', 'המאמן צריך לסיים את ההגדרה.'));
    sb = supabase.createClient(CFG.URL, CFG.ANON);

    // אין טוקן בכתובת? אולי המכשיר כבר התחבר בעבר.
    if (!TOKEN) TOKEN = localStorage.getItem('ebfit_t_token') || '';
    if (!TOKEN) return loginScreen();

    CACHE = 'ebfit_t_' + TOKEN.slice(0, 12);
    if (window.EBProg) EBProg.load(TOKEN);
    MY_MEALS = readMy();
    BUILD = readBuild();
    MY_EX = readEx();

    // קודם מהמטמון — כדי שהתוכנית תיפתח מיד גם בלי רשת
    const cached = readCache();
    if (cached) { DATA = cached; paint(); }

    try {
      const { data, error } = await sb.rpc('trainee_program', { p_token: TOKEN });
      if (error) throw error;
      if (!data || !data.length) {
        if (cached) return toast('אין חיבור — מוצגת הגרסה השמורה');
        return screen(msg('הקישור לא פעיל', 'ייתכן שהמאמן ביטל את הגישה. פנה אליו.'));
      }
      DATA = data[0];
      mergeMy(DATA.meals_self);
      mergeEx(DATA.exercises_self);
      writeCache(DATA);
      paint();
    } catch (e) {
      if (!DATA) screen(msg('לא הצלחנו להתחבר', 'בדוק חיבור לאינטרנט ונסה שוב.'));
      else toast('אין חיבור — מוצגת הגרסה השמורה');
    }
  }

  function msg(h, p) { return '<div class="msg"><h2>' + esc(h) + '</h2>' + esc(p) + '</div>'; }

  /* ---------- כניסה עם שם משתמש ---------- */
  function loginScreen(err) {
    DATA = null;
    screen('<div class="card" style="margin-top:24px">'
      + '<h2 style="font-size:19px;margin-bottom:4px">הכניסה שלך</h2>'
      + '<p style="color:var(--mut);font-size:13px;margin:0 0 16px">הפרטים שקיבלת מהמאמן.</p>'
      + '<label style="font-size:13px;color:var(--mut)">שם משתמש</label>'
      + '<input id="lg_u" autocapitalize="none" autocorrect="off" spellcheck="false" '
      + 'style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;'
      + 'padding:12px;margin:6px 0 12px;font-size:16px;direction:ltr;text-align:left">'
      + '<label style="font-size:13px;color:var(--mut)">סיסמה</label>'
      + '<input id="lg_p" type="password" autocapitalize="none" autocorrect="off" spellcheck="false" '
      + 'style="width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;'
      + 'padding:12px;margin:6px 0 4px;font-size:16px;direction:ltr;text-align:left">'
      + (err ? '<div style="color:#D9605A;font-size:13px;margin-top:8px">' + esc(err) + '</div>' : '')
      + '<button class="btn" id="lg_go" style="width:100%;margin-top:14px">כניסה</button>'
      + '</div>');
    var go = document.getElementById('lg_go');
    go.onclick = doLogin;
    document.getElementById('lg_p').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });
  }

  async function doLogin() {
    var u = (document.getElementById('lg_u') || {}).value || '';
    var p = (document.getElementById('lg_p') || {}).value || '';
    if (!u.trim() || !p) { loginScreen('צריך למלא שם משתמש וסיסמה'); return; }
    var btn = document.getElementById('lg_go');
    if (btn) { btn.disabled = true; btn.textContent = 'בודק…'; }
    try {
      /* מקלדת הטלפון מגדילה את האות הראשונה בשדה סיסמה, וזה היה
         הכשל הנפוץ ביותר בכניסה. הפרטים נוצרים באותיות קטנות בלבד,
         ולכן הורדה לאותיות קטנות כאן מיישרת את שני הצדדים. */
      var r = await sb.rpc('trainee_login',
        { p_username: u.trim().toLowerCase(), p_password: String(p).toLowerCase() });
      if (r.error) throw r.error;
      var d = r.data && r.data[0];
      if (!d) throw new Error('שם משתמש או סיסמה שגויים');

      TOKEN = d.token;
      CACHE = 'ebfit_t_' + TOKEN.slice(0, 12);
    if (window.EBProg) EBProg.load(TOKEN);
    MY_MEALS = readMy();
    BUILD = readBuild();
    MY_EX = readEx();
      try { localStorage.setItem('ebfit_t_token', TOKEN); } catch (e) {}

      DATA = d;
      mergeMy(d.meals_self);
      mergeEx(d.exercises_self);
      writeCache(d);
      paint();
    } catch (e) {
      loginScreen((e && e.message) || 'לא הצלחנו להיכנס');
    }
  }

  function logout() {
    try {
      localStorage.removeItem('ebfit_t_token');
      if (CACHE) localStorage.removeItem(CACHE);
    } catch (e) {}
    TOKEN = ''; DATA = null;
    var b = document.querySelector('.bar'); if (b) b.remove();
    $('#hTitle').textContent = 'התוכנית שלי'; $('#hSub').textContent = '';
    location.hash = '';
    loginScreen();
  }
  window.__ebLogout = logout;

  /* ---------- תפריט הארוחות ----------
     תמונה שווה יותר מרשימת מרכיבים: המתאמן רואה מה בדיוק לשים בצלחת.
     הערכים מוצגים לצד כל ארוחה, וסיכום יומי בראש. */
  const MEAL_TYPES = { breakfast:'בוקר', lunch:'צהריים', dinner:'ערב',
                       snack:'ביניים', pre:'לפני אימון', post:'אחרי אימון' };

  function mealsBlock(meals) {
    if (!meals || !meals.length) return '';
    const n = v => { const x = Number(v); return isFinite(x) && x > 0 ? x : 0; };
    const tot = meals.reduce((a,m) => ({
      kcal:a.kcal+n(m.kcal), p:a.p+n(m.protein), c:a.c+n(m.carbs), f:a.f+n(m.fat)
    }), {kcal:0,p:0,c:0,f:0});

    let h = '<div class="card" style="margin-bottom:12px">'
      + '<div style="font-size:13px;color:var(--mut);margin-bottom:10px">התפריט שלך · '
      + meals.length + ' ארוחות</div>';

    if (tot.kcal) {
      h += '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:4px">'
        + '<span><b style="font-family:Heebo;color:var(--or)">' + tot.kcal + '</b> קק״ל</span>'
        + (tot.p ? '<span class="mt">חלבון <b>' + tot.p + '</b></span>' : '')
        + (tot.c ? '<span class="mt">פחמימות <b>' + tot.c + '</b></span>' : '')
        + (tot.f ? '<span class="mt">שומן <b>' + tot.f + '</b></span>' : '')
        + '</div>';
    }
    h += '</div>';

    // מקובץ לפי סוג, בסדר היום
    const order = ['breakfast','pre','post','lunch','snack','dinner','other'];
    const by = {};
    meals.forEach(m => { const k = MEAL_TYPES[m.type] ? m.type : 'other';
                         (by[k] = by[k] || []).push(m); });

    order.forEach(k => {
      const g = by[k];
      if (!g) return;
      h += '<div style="font-size:12px;color:var(--dim);letter-spacing:.1em;margin:14px 0 8px">'
        + esc(MEAL_TYPES[k] || 'נוספות') + '</div>';
      g.forEach(m => {
        h += '<div class="card" style="padding:0;overflow:hidden;margin-bottom:10px">'
          + (m.photo
              ? '<img src="' + esc(m.photo) + '" alt="' + esc(m.name||'') + '" loading="lazy" '
                + 'style="width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--ink)">'
              : '')
          + '<div style="padding:13px">'
          + '<div style="font-family:Heebo;font-weight:700;font-size:16px;line-height:1.3">'
          + esc(m.name || 'ארוחה') + '</div>'
          + (m.desc ? '<div style="color:var(--mut);font-size:13.5px;margin-top:5px;line-height:1.5;white-space:pre-wrap">'
                      + esc(m.desc) + '</div>' : '')
          + (n(m.kcal)||n(m.protein)||n(m.carbs)||n(m.fat)
              ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">'
                + (n(m.kcal)    ? tag(n(m.kcal) + ' קק״ל', 1) : '')
                + (n(m.protein) ? tag('חלבון ' + n(m.protein)) : '')
                + (n(m.carbs)   ? tag('פחמימות ' + n(m.carbs)) : '')
                + (n(m.fat)     ? tag('שומן ' + n(m.fat)) : '')
                + '</div>' : '')
          + '</div></div>';
      });
    });
    return h;
  }
  function tag(txt, hot) {
    return '<span style="font-size:12px;padding:4px 10px;border-radius:20px;white-space:nowrap;'
      + (hot ? 'background:var(--or-soft);color:var(--or);border:1px solid rgba(255,106,26,.3)'
             : 'background:var(--card);color:var(--mut);border:1px solid var(--line)') + '">'
      + esc(txt) + '</span>';
  }

  /* ---------- ספריית הארוחות ----------
     כל 42 הארוחות זמינות לכל מתאמן, גם אלה שלא שויכו לו. הטבלה של
     כל ארוחה סגורה כברירת מחדל — 42 טבלאות פתוחות בטלפון הופכות
     את המסך לבלתי קריא. */
  let LIB_OPEN = false, LIB_Q = '', LIB_TYPE = 'all', LIB_ROW = {}, LIB_TAB = 'meals';

  /* מחשבון הארוחה. מחליף את הצורך לצלם: בוחרים מוצרים, כותבים כמה
     גרם, ומקבלים את הערכים. נשמר במכשיר כדי ששורה שהוקלדה לא תיעלם
     בגלילה או ברענון. */
  let BUILD = [];
  const buildKey = () => 'ebfit_build_' + String(TOKEN || '').slice(0, 12);
  function readBuild() { try { return JSON.parse(localStorage.getItem(buildKey())) || []; } catch (e) { return []; } }
  function writeBuild() { try { localStorage.setItem(buildKey(), JSON.stringify(BUILD)); } catch (e) {} }
  function buildTotals() {
    let k = 0, p = 0, c = 0, f = 0;
    BUILD.forEach(x => {
      const v = EBLib.DB[x.n]; if (!v) return;
      const g = Number(x.g) || 0;
      k += v[0]*g/100; p += v[1]*g/100; c += v[2]*g/100; f += v[3]*g/100;
    });
    return { k, p, c, f };
  }

  function r1(x){ return Math.round(x*10)/10; }

  function libButton() {
    if (typeof EBLib === 'undefined') return '';
    return '<button class="btn ghost" style="width:100%;margin-bottom:12px;font-size:14px" '
      + 'onclick="__libOpen()">כל הארוחות · ' + EBLib.MEALS.length + ' עם ערכים מלאים'
      + (MY_MEALS.length ? ' · <b style="color:var(--or)">' + MY_MEALS.length + ' שלי</b>' : '')
      + '</button>';
  }

  function libScreen() {
    const q = LIB_Q.trim();
    /* אוכל לא כשר לא ברשימה הרגילה — רק בקטגוריה שלו */
    const only = (LIB_TYPE === 'nonkosher');
    const items = EBLib.MEALS.filter(m => {
      const k = EBLib.kosherOf(m);
      if (only) { if (k === 'ok') return false; }
      else {
        if (k !== 'ok') return false;
        if (LIB_TYPE !== 'all' && m.type !== LIB_TYPE) return false;
      }
      if (!q) return true;
      return m.name.indexOf(q) > -1 || m.items.some(p => p[0].indexOf(q) > -1);
    });
    const counts = EBLib.byType();

    let h = '<button class="btn ghost" style="margin-bottom:12px" onclick="__libClose()">‹ חזרה לתוכנית</button>'
      + '<input id="lq" placeholder="חיפוש ארוחה או מרכיב" value="' + esc(LIB_Q) + '" '
      + 'oninput="__libSearch(this.value)" style="width:100%;background:var(--card);'
      + 'border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;margin-bottom:10px">'
      + '<div style="display:flex;gap:6px;margin-bottom:12px">'
      + libTab('meals','ארוחות',EBLib.MEALS.length)
      + libTab('prod','מוצרים בודדים',Object.keys(EBLib.DB).length)
      + '</div>';

    if (LIB_TAB === 'prod') return h + buildPanel() + prodTable();

    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">'
      + libTag('all','הכול',EBLib.MEALS.filter(m=>EBLib.kosherOf(m)==='ok').length);
    ['breakfast','pre','post','lunch','snack','dinner'].forEach(k => {
      if (counts[k]) h += libTag(k, EBLib.TYPES[k], counts[k].length);
    });
    const nk = EBLib.MEALS.filter(m => EBLib.kosherOf(m) !== 'ok').length;
    if (nk) h += libTag('nonkosher', 'לא כשר', nk);
    h += '</div><div style="color:var(--mut);font-size:12.5px;margin-bottom:10px">' + items.length + ' ארוחות</div>';

    if (!items.length) h += '<div class="msg">לא נמצאה ארוחה מתאימה.</div>';
    items.forEach(m => h += libCard(m));
    return h;
  }

  function libTab(k, label, n) {
    const on = LIB_TAB === k;
    return '<button data-libtab="' + k + '" style="flex:1;font-size:13px;padding:9px 10px;'
      + 'border-radius:10px;cursor:pointer;font-family:Heebo;font-weight:700;'
      + 'border:1px solid ' + (on ? 'var(--or)' : 'var(--line)') + ';'
      + 'background:' + (on ? 'var(--or-soft)' : 'var(--card)') + ';'
      + 'color:' + (on ? 'var(--or)' : 'var(--mut)') + '">'
      + esc(label) + ' <span style="opacity:.6">' + n + '</span></button>';
  }

  function libTag(k, label, n) {
    const on = LIB_TYPE === k;
    return '<button data-lt="' + esc(k) + '" style="font-size:12.5px;padding:6px 12px;'
      + 'border-radius:20px;white-space:nowrap;border:1px solid ' + (on?'var(--or)':'var(--line)') + ';'
      + 'background:' + (on?'var(--or-soft)':'var(--card)') + ';color:' + (on?'var(--or)':'var(--mut)') + '">'
      + esc(label) + ' <span style="opacity:.6">' + n + '</span></button>';
  }

  /* השרת הוא המקור האמין. אם הוא החזיר רשימה — היא גוברת על המכשיר,
     כך שהוספה שנעשתה בטלפון אחר מופיעה גם כאן. */
  function mergeMy(fromServer) {
    if (!Array.isArray(fromServer)) return;      // העמודה עוד לא קיימת בשרת
    MY_MEALS = fromServer;
    writeMy();
  }

  async function myAdd(libId) {
    const meal = EBLib.byId(libId);
    if (!meal || inMy(libId)) return;
    MY_MEALS.push({ libId: libId, name: meal.name, at: todayStr() });
    writeMy(); refreshLib(libId);
    toast(meal.name + ' נוספה לתפריט שלך');
    try {
      const { data, error } = await sb.rpc('trainee_add_meal',
        { p_token: TOKEN, p_lib_id: libId, p_name: meal.name });
      if (error) throw error;
      mergeMy(data);
    } catch (e) {
      /* בלי הפונקציה בשרת ההוספה נשארת במכשיר. עדיין עובד למתאמן,
         רק שהמאמן לא רואה — ולכן הודעה אחת ולא כישלון. */
      toast('נשמר במכשיר. המאמן יראה אחרי שיסיים את ההגדרה.');
    }
  }

  async function myRemove(libId) {
    const wasCustom = MY_MEALS.some(x => x.custom && x.name === libId);
    MY_MEALS = MY_MEALS.filter(x => x.custom ? x.name !== libId : x.libId !== libId);
    if (wasCustom) { writeMy(); paint(); return; }   // מותאמת — מקומית בלבד
    writeMy(); refreshLib(libId);
    try {
      const { data, error } = await sb.rpc('trainee_remove_meal',
        { p_token: TOKEN, p_lib_id: libId });
      if (error) throw error;
      mergeMy(data);
    } catch (e) {}
  }

  function todayStr() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
         + '-' + String(d.getDate()).padStart(2,'0');
  }

  /* מעדכנים כרטיס אחד ולא מציירים מחדש — ציור מלא מחזיר את הגלילה
     לראש המסך, וזה בדיוק מה שתוקן בפירוט הארוחה. */
  function refreshLib(libId) {
    const el = document.querySelector('[data-mid="' + libId + '"] [data-my]');
    if (el) {
      const on = inMy(libId);
      el.textContent = on ? '✓ בתפריט שלי' : '+ הוספה לתפריט שלי';
      el.style.background = on ? 'var(--or-soft)' : 'transparent';
      el.style.color = on ? 'var(--or)' : 'var(--mut)';
      el.style.borderColor = on ? 'var(--or)' : 'var(--line2)';
    }
    const cnt = document.getElementById('myCount');
    if (cnt) cnt.textContent = MY_MEALS.length;
  }

  /* מה שהמתאמן הוסיף — מוצג בנפרד מהתפריט של המאמן, כדי שלא
     ייווצר רושם שהמאמן רשם את זה. */
  function myMealsBlock() {
    if (typeof EBLib === 'undefined' || !MY_MEALS.length) return '';
    const rows = MY_MEALS.map(x => {
      if (x.custom) return { name: x.name, custom: true, type: '',
                             tot: { k:x.k||0, p:x.p||0, c:x.c||0, f:x.f||0 }, key: x.name };
      const m = EBLib.byId(x.libId);
      if (!m) return null;
      const t = EBLib.calc(m.items).total;
      return { name: m.name, type: m.type, tot: t, key: m.id };
    }).filter(Boolean);
    if (!rows.length) return '';
    let k = 0, p = 0, c = 0, f = 0;
    rows.forEach(m => { k += m.tot.k; p += m.tot.p; c += m.tot.c; f += m.tot.f; });
    const r0 = x => Math.round(x);
    let h = '<div class="card" style="margin-bottom:12px;border-color:var(--line2)">'
      + '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">'
      + '<div style="flex:1;font-family:Frank Ruhl Libre,serif;font-weight:700;font-size:15px">'
      + 'הוספתי לעצמי</div>'
      + '<span class="mt" style="font-size:12px">' + rows.length + ' ארוחות</span></div>'
      + '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin-bottom:10px">'
      + '<span><b style="font-family:Heebo;color:var(--or)">' + r0(k) + '</b> קק״ל</span>'
      + '<span class="mt">חלבון <b>' + r0(p) + '</b></span>'
      + '<span class="mt">פחמימות <b>' + r0(c) + '</b></span>'
      + '<span class="mt">שומן <b>' + r0(f) + '</b></span></div>';
    rows.forEach(m => {
      h += '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;'
        + 'border-top:1px solid var(--line)">'
        + '<div style="flex:1;min-width:0">'
        + '<div style="font-size:14px;font-weight:500">' + esc(m.name) + '</div>'
        + '<div class="mt" style="font-size:11.5px;margin-top:2px">'
        + esc(m.custom ? 'בניתי בעצמי' : (EBLib.TYPES[m.type] || '')) + '</div></div>'
        + '<span style="font-family:Heebo;font-weight:700;font-size:14px">'
        + Math.round(m.tot.k) + '</span>'
        + '<button data-myrm="' + esc(m.key) + '" style="background:none;border:0;'
        + 'color:var(--dim);font-size:17px;cursor:pointer;padding:0 4px;line-height:1">✕</button>'
        + '</div>';
    });
    return h + '</div>';
  }

  /* אותו מסד שממנו מחושבות הארוחות — לא רשימה שנייה שיכולה להתיישן */
  /* הפאנל מופיע רק כשיש מה להראות — פאנל ריק קבוע היה גוזל שליש
     ממסך הטלפון בלי לתת כלום. */
  function refreshTot() {
    const box = document.querySelector('[data-bsave]');
    if (!box) return;
    const t = buildTotals(), r0 = x => Math.round(x);
    const row = box.previousElementSibling;
    if (!row) return;
    row.innerHTML =
        '<span><b style="font-family:Heebo;font-size:19px;color:var(--or)">' + r0(t.k) + '</b> קק״ל</span>'
      + '<span class="mt">חלבון <b>' + r0(t.p) + '</b></span>'
      + '<span class="mt">פחמימות <b>' + r0(t.c) + '</b></span>'
      + '<span class="mt">שומן <b>' + r0(t.f) + '</b></span>';
  }

  /* נשמר במכשיר בלבד. אין לזה מזהה בספרייה, ולכן אין מה לשלוח
     לשרת בלי לשנות את מבנה הנתונים שם. */
  function saveBuild() {
    const items = BUILD.filter(x => Number(x.g) > 0);
    if (!items.length) { toast('הוסף מוצר קודם'); return; }
    const t = buildTotals();
    const name = items.slice(0, 3).map(x => x.n).join(' · ')
               + (items.length > 3 ? ' ועוד ' + (items.length - 3) : '');
    MY_MEALS.push({
      custom: true, name: name,
      items: items.map(x => [x.n, Number(x.g)]),
      k: Math.round(t.k), p: Math.round(t.p), c: Math.round(t.c), f: Math.round(t.f),
      at: todayStr()
    });
    writeMy();
    BUILD = []; writeBuild();
    toast('נשמר בתפריט שלך');
    screen(libScreen());
  }

  function buildPanel() {
    if (!BUILD.length) {
      return '<div class="card" style="margin-bottom:12px;background:transparent;border-style:dashed">'
        + '<div style="color:var(--mut);font-size:13px;line-height:1.6">'
        + 'לחץ <b style="color:var(--or)">+</b> ליד מוצר כדי לבנות ארוחה ולראות כמה יצא.'
        + '</div></div>';
    }
    const t = buildTotals(), r0 = x => Math.round(x);
    let h = '<div class="card" style="margin-bottom:12px;border-color:var(--or)">'
      + '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">'
      + '<div style="flex:1;font-family:Frank Ruhl Libre,serif;font-weight:700;font-size:15px">'
      + 'הארוחה שלי</div>'
      + '<button data-bclear style="background:none;border:0;color:var(--dim);'
      + 'font-size:12.5px;cursor:pointer;text-decoration:underline">ניקוי</button></div>';

    BUILD.forEach((x, i) => {
      h += '<div style="display:flex;align-items:center;gap:8px;padding:7px 0;'
        + 'border-top:1px solid var(--line)">'
        + '<span style="flex:1;min-width:0;font-size:13.5px">' + esc(x.n) + '</span>'
        + '<input data-bg="' + i + '" type="number" inputmode="numeric" value="' + esc(x.g) + '" '
        + 'style="width:66px;background:var(--ink);border:1px solid var(--line);border-radius:8px;'
        + 'padding:6px;font-size:14px;text-align:center">'
        + '<span style="color:var(--dim);font-size:12px">גר׳</span>'
        + '<button data-brm="' + i + '" style="background:none;border:0;color:var(--dim);'
        + 'font-size:16px;cursor:pointer;padding:0 4px;line-height:1">✕</button></div>';
    });

    h += '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:11px;'
      + 'border-top:2px solid var(--or);font-size:13.5px">'
      + '<span><b style="font-family:Heebo;font-size:19px;color:var(--or)">' + r0(t.k) + '</b> קק״ל</span>'
      + '<span class="mt">חלבון <b>' + r0(t.p) + '</b></span>'
      + '<span class="mt">פחמימות <b>' + r0(t.c) + '</b></span>'
      + '<span class="mt">שומן <b>' + r0(t.f) + '</b></span></div>'
      + '<button class="btn" data-bsave style="width:100%;margin-top:11px">שמירה בתפריט שלי</button>'
      + '</div>';
    return h;
  }

  function prodTable() {
    const q = LIB_Q.trim();
    const onlyNk = (LIB_TYPE === 'nonkosher');
    const names = Object.keys(EBLib.DB)
      .filter(n => {
        const bad = EBLib.NONKOSHER.indexOf(n) > -1;
        if (onlyNk ? !bad : bad) return false;
        return !q || n.indexOf(q) > -1;
      })
      .sort((a, b) => a.localeCompare(b, 'he'));
    let h = '<div style="color:var(--dim);font-size:12.5px;margin-bottom:8px">'
      + names.length + ' מוצרים · הערכים ל-100 גרם</div>';
    if (!names.length) return h + '<div class="card" style="text-align:center;color:var(--mut)">לא נמצא מוצר מתאים.</div>';
    h += '<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px">'
      + '<thead><tr>' + lth('מוצר','right') + lth('קק״ל') + lth('חלבון') + lth('פחמ׳') + lth('שומן')
      + '</tr></thead><tbody>';
    names.forEach(n => {
      const v = EBLib.DB[n];
      const inB = BUILD.some(x => x.n === n);
      h += '<tr>'
         + '<td style="padding:5px 4px;border-bottom:1px solid var(--line);text-align:right">'
         + '<button data-badd="' + esc(n) + '" style="background:none;border:0;cursor:pointer;'
         + 'font-size:15px;line-height:1;padding:0 6px 0 0;color:'
         + (inB ? 'var(--or)' : 'var(--dim)') + '">' + (inB ? '✓' : '+') + '</button>'
         + esc(n) + '</td>'
         + ltd('<b>' + v[0] + '</b>') + ltd(r1(v[1])) + ltd(r1(v[2])) + ltd(r1(v[3])) + '</tr>';
    });
    return h + '</tbody></table></div>';
  }

  function mergeEx(fromServer) {
    if (!Array.isArray(fromServer)) return;   // העמודה עוד לא קיימת בשרת
    MY_EX = fromServer;
    writeEx();
  }

  async function exAdd(id) {
    const x = EBEx.byId(id);
    if (!x || inEx(id)) return;
    MY_EX.push({ exId: id, name: x.n, at: todayStr() });
    writeEx(); refreshEx(id);
    toast(x.n + ' נוסף לאימון שלך');
    try {
      const { data, error } = await sb.rpc('trainee_add_exercise',
        { p_token: TOKEN, p_ex_id: id, p_name: x.n });
      if (error) throw error;
      mergeEx(data);
    } catch (e) {
      toast('נשמר במכשיר. המאמן יראה אחרי שיסיים את ההגדרה.');
    }
  }

  async function exRemove(id) {
    MY_EX = MY_EX.filter(x => x.exId !== id);
    writeEx(); refreshEx(id);
    try {
      const { data, error } = await sb.rpc('trainee_remove_exercise',
        { p_token: TOKEN, p_ex_id: id });
      if (error) throw error;
      mergeEx(data);
    } catch (e) {}
  }

  /* כרטיס אחד ולא ציור מחדש — הגלילה לא זזה */
  function refreshEx(id) {
    const b = document.querySelector('[data-exadd="' + id + '"]');
    if (b) {
      const on = inEx(id);
      b.textContent = on ? '✓ באימון שלי' : '+ הוספה לאימון שלי';
      b.style.background  = on ? 'var(--or-soft)' : 'transparent';
      b.style.color       = on ? 'var(--or)' : 'var(--mut)';
      b.style.borderColor = on ? 'var(--or)' : 'var(--line2)';
    }
    const c = document.getElementById('exCount');
    if (c) c.textContent = MY_EX.length;
  }

  function exButton() {
    if (typeof EBEx === 'undefined') return '';
    return '<button class="btn ghost" style="width:100%;margin-bottom:12px;font-size:14px" '
      + 'onclick="__exOpen()">ספריית התרגילים · ' + EBEx.count
      + (MY_EX.length ? ' · <b style="color:var(--or)">' + MY_EX.length + ' שלי</b>' : '')
      + '</button>';
  }

  function exScreen() {
    const items = EBEx.search(EX_Q, EX_MUS, 'all');
    const byM = EBEx.byMuscle();
    let h = '<button class="btn ghost" style="margin-bottom:12px" onclick="__exClose()">‹ חזרה לתוכנית</button>'
      + '<input id="exq" placeholder="חיפוש לפי שם, שריר או ציוד" value="' + esc(EX_Q) + '" '
      + 'oninput="__exSearch(this.value)" style="width:100%;background:var(--card);'
      + 'border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;margin-bottom:10px">'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">'
      + exTag('all', 'הכול', EBEx.count);
    Object.keys(EBEx.MUSCLES).forEach(k => {
      if (byM[k]) h += exTag(k, EBEx.MUSCLES[k], byM[k].length);
    });
    h += '</div><div style="color:var(--mut);font-size:12.5px;margin-bottom:10px">'
      + items.length + ' תרגילים</div>';

    if (!items.length) return h + '<div class="msg">לא נמצא תרגיל מתאים.</div>';

    items.forEach(x => {
      const on = inEx(x.id);
      h += '<div class="card" style="margin-bottom:9px;padding:12px">'
        + '<div style="font-family:Heebo;font-weight:700;font-size:15px;line-height:1.3">'
        + esc(x.n) + '</div>'
        + '<div style="display:flex;gap:6px;margin-top:7px;flex-wrap:wrap">'
        + tag(EBEx.MUSCLES[x.m]) + tag(EBEx.EQUIP[x.e] || 'אחר')
        + tag(x.s + '×' + x.r, 1) + '</div>'
        + (x.note ? '<div style="font-size:12px;color:var(--or);margin-top:7px;line-height:1.5">'
                    + esc(x.note) + '</div>' : '')
        + '<button data-exadd="' + esc(x.id) + '" style="font-size:12.5px;padding:7px 14px;'
        + 'margin-top:10px;border-radius:9px;cursor:pointer;'
        + 'border:1px solid ' + (on ? 'var(--or)' : 'var(--line2)') + ';'
        + 'background:' + (on ? 'var(--or-soft)' : 'transparent') + ';'
        + 'color:' + (on ? 'var(--or)' : 'var(--mut)') + '">'
        + (on ? '✓ באימון שלי' : '+ הוספה לאימון שלי') + '</button></div>';
    });
    return h;
  }

  function exTag(k, label, n) {
    const on = EX_MUS === k;
    return '<button data-exmus="' + k + '" style="font-size:12.5px;padding:6px 12px;'
      + 'border-radius:20px;cursor:pointer;white-space:nowrap;'
      + 'border:1px solid ' + (on ? 'var(--or)' : 'var(--line)') + ';'
      + 'background:' + (on ? 'var(--or-soft)' : 'var(--card)') + ';'
      + 'color:' + (on ? 'var(--or)' : 'var(--mut)') + '">'
      + esc(label) + ' <span style="opacity:.6">' + n + '</span></button>';
  }

  /* מוצג בנפרד מהתוכנית של המאמן, כדי שלא ייווצר רושם שהוא רשם את זה */
  function myExBlock() {
    if (typeof EBEx === 'undefined' || !MY_EX.length) return '';
    const rows = MY_EX.map(x => EBEx.byId(x.exId)).filter(Boolean);
    if (!rows.length) return '';
    let h = '<div class="card" style="margin-bottom:12px;border-color:var(--line2)">'
      + '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px">'
      + '<div style="flex:1;font-family:Frank Ruhl Libre,serif;font-weight:700;font-size:15px">'
      + 'תרגילים שהוספתי</div>'
      + '<span class="mt" style="font-size:12px">' + rows.length + '</span></div>';
    rows.forEach(x => {
      h += '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;'
        + 'border-top:1px solid var(--line)">'
        + '<div style="flex:1;min-width:0">'
        + '<div style="font-size:14px;font-weight:500">' + esc(x.n) + '</div>'
        + '<div class="mt" style="font-size:11.5px;margin-top:2px">'
        + esc(EBEx.MUSCLES[x.m]) + ' · ' + esc(EBEx.EQUIP[x.e] || 'אחר') + '</div></div>'
        + '<span style="font-family:Heebo;font-weight:700;font-size:13px;white-space:nowrap">'
        + esc(x.s) + '×' + esc(x.r) + '</span>'
        + '<button data-exrm="' + esc(x.id) + '" style="background:none;border:0;color:var(--dim);'
        + 'font-size:17px;cursor:pointer;padding:0 4px;line-height:1">✕</button></div>';
    });
    return h + '</div>';
  }

  function libCard(m) {
    const c = EBLib.calc(m.items), t = c.total, open = !!LIB_ROW[m.id];
    let h = '<div class="card" style="margin-bottom:10px" data-mid="' + esc(m.id) + '">'
      + '<div style="display:flex;align-items:flex-start;gap:10px">'
      + '<div style="flex:1;min-width:0">'
      + '<div style="font-family:Heebo;font-weight:700;font-size:15.5px;line-height:1.3">' + esc(m.name) + '</div>'
      + '<div style="color:var(--dim);font-size:12px;margin-top:3px">' + esc(EBLib.TYPES[m.type]||'') + '</div></div>'
      + '<div style="text-align:center;flex:none">'
      + '<div style="font-family:Heebo;font-weight:900;font-size:21px;color:var(--or);line-height:1">' + Math.round(t.k) + '</div>'
      + '<div style="color:var(--dim);font-size:10.5px">קק״ל</div></div></div>'
      + '<div style="display:flex;gap:6px;margin-top:9px;flex-wrap:wrap">'
      + tag('חלבון ' + r1(t.p)) + tag('פחמימות ' + r1(t.c)) + tag('שומן ' + r1(t.f)) + '</div>'
      + (EBLib.kosherOf(m) !== 'ok'
          ? '<div style="font-size:11.5px;color:#D9605A;margin-top:8px;font-weight:600">⚠ '
            + esc(EBLib.kosherLabel(EBLib.kosherOf(m))) + '</div>' : '')
      + (m.note ? '<div style="font-size:12px;color:var(--or);margin-top:8px;line-height:1.5">' + esc(m.note) + '</div>' : '')
      + '<button class="btn ghost" style="font-size:12.5px;padding:7px 14px;margin-top:10px" '
      + 'data-lr="' + esc(m.id) + '">' + (open ? 'סגירת הפירוט' : 'פירוט לגרם') + '</button>'
      + '<button data-my="' + esc(m.id) + '" style="font-size:12.5px;padding:7px 14px;'
      + 'margin-top:10px;margin-inline-start:7px;border-radius:9px;cursor:pointer;'
      + 'border:1px solid ' + (inMy(m.id) ? 'var(--or)' : 'var(--line2)') + ';'
      + 'background:' + (inMy(m.id) ? 'var(--or-soft)' : 'transparent') + ';'
      + 'color:' + (inMy(m.id) ? 'var(--or)' : 'var(--mut)') + '">'
      + (inMy(m.id) ? '✓ בתפריט שלי' : '+ הוספה לתפריט שלי') + '</button>';

    if (open) {
      h += '<div data-mtbl style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px">'
        + '<thead><tr>' + lth('רכיב','right') + lth('גרם') + lth('קק״ל') + lth('חלבון') + lth('פחמ׳') + lth('שומן') + '</tr></thead><tbody>';
      c.rows.forEach(r => {
        h += '<tr>' + ltd(esc(r.name),'right') + ltd(r.g) + ltd(Math.round(r.k))
           + ltd(r1(r.p)) + ltd(r1(r.c)) + ltd(r1(r.f)) + '</tr>';
      });
      h += '<tr style="border-top:2px solid var(--or)">'
        + ltd('<b>סה״כ</b>','right') + ltd('<b>'+t.g+'</b>') + ltd('<b>'+Math.round(t.k)+'</b>')
        + ltd('<b>'+r1(t.p)+'</b>') + ltd('<b>'+r1(t.c)+'</b>') + ltd('<b>'+r1(t.f)+'</b>')
        + '</tr></tbody></table></div>';
    }
    return h + '</div>';
  }
  function lth(x,a){ return '<th style="text-align:'+(a||'left')+';padding:5px 4px;border-bottom:1px solid var(--line);font-size:11px;color:var(--mut);font-weight:500;white-space:nowrap">'+x+'</th>'; }
  function ltd(x,a){ return '<td style="text-align:'+(a||'left')+';padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums">'+x+'</td>'; }

  window.__exOpen   = () => { EX_OPEN = true; EX_Q=''; EX_MUS='all'; screen(exScreen()); window.scrollTo(0,0); };
  window.__exClose  = () => { EX_OPEN = false; if (DATA) paint(); else loginScreen(); window.scrollTo(0,0); };
  window.__exSearch = v => { EX_Q = v; screen(exScreen());
                             const el = document.getElementById('exq');
                             if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } };

  window.__libOpen   = (type) => { LIB_OPEN = true; LIB_TAB = 'meals';
    /* נפתחת מסוננת לתא שממנו נלחצה — מתאמן שלחץ 'הוספה לבוקר'
       לא צריך לחפש שוב בין 400 ארוחות. */
    LIB_TYPE = (typeof type === 'string' && type && type !== 'other') ? type : 'all';
    screen(libScreen()); window.scrollTo(0,0); };
  /* בלי תוכנית טעונה אין למה לחזור — paint() קורא מ-DATA ונופל.
     קורה אם הטוקן בוטל או שהמטמון נוקה בזמן שהספרייה פתוחה. */
  window.__libClose  = () => {
    LIB_OPEN = false;
    if (DATA) paint(); else loginScreen();
    window.scrollTo(0,0);
  };
  window.__libSearch = v => { LIB_Q = v; screen(libScreen());
                              const el = document.getElementById('lq');
                              if (el) { el.focus(); el.setSelectionRange(v.length, v.length); } };
  /* מאזין אחד במקום onclick מוטבע: הזרקת מזהה לתוך מחרוזת בתוך
     מאפיין HTML נשברת בקלות על ציטוטים, וזה בדיוק מה שקרה כאן. */
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-lt]');
    if (t) { LIB_TYPE = t.dataset.lt; screen(libScreen()); return; }
    var sl = e.target.closest('[data-slot]');
    if (sl) { var i = +sl.dataset.slot; SLOT = (SLOT === i ? -1 : i); paint(); return; }
    const ba = e.target.closest('[data-badd]');
    if (ba) {
      const n = ba.dataset.badd;
      const i = BUILD.findIndex(x => x.n === n);
      if (i > -1) BUILD.splice(i, 1); else BUILD.push({ n: n, g: 100 });
      writeBuild(); screen(libScreen());
      return;
    }
    const brm = e.target.closest('[data-brm]');
    if (brm) { BUILD.splice(+brm.dataset.brm, 1); writeBuild(); screen(libScreen()); return; }
    if (e.target.closest('[data-bclear]')) { BUILD = []; writeBuild(); screen(libScreen()); return; }
    if (e.target.closest('[data-bsave]')) { saveBuild(); return; }

    const ea = e.target.closest('[data-exadd]');
    if (ea) { const id = ea.dataset.exadd; inEx(id) ? exRemove(id) : exAdd(id); return; }
    const er = e.target.closest('[data-exrm]');
    if (er) { exRemove(er.dataset.exrm); paint(); return; }
    const em = e.target.closest('[data-exmus]');
    if (em) { EX_MUS = em.dataset.exmus; screen(exScreen()); window.scrollTo(0,0); return; }

    const lt = e.target.closest('[data-libtab]');
    if (lt) { LIB_TAB = lt.dataset.libtab; screen(libScreen()); window.scrollTo(0,0); return; }

    const my = e.target.closest('[data-my]');
    if (my) { const id = my.dataset.my; inMy(id) ? myRemove(id) : myAdd(id); return; }

    const rm = e.target.closest('[data-myrm]');
    if (rm) { myRemove(rm.dataset.myrm); paint(); return; }

    const r = e.target.closest('[data-lr]');
    if (r) {
      /* פתיחת פירוט משנה כרטיס אחד. ציור מחדש של כל הרשימה החזיר
         את הגלילה לראש המסך — אחרי ארוחה עשרים זה אומר לגלול הכול
         שוב. הטבלה נכנסת ויוצאת במקום. */
      const id = r.dataset.lr;
      LIB_ROW[id] = !LIB_ROW[id];
      const cardEl = r.closest('[data-mid]');
      const meal = EBLib.byId(id);
      if (!cardEl || !meal) { screen(libScreen()); return; }
      const tbl = cardEl.querySelector('[data-mtbl]');
      if (LIB_ROW[id]) {
        if (!tbl) {
          const tmp = document.createElement('div');
          tmp.innerHTML = libCard(meal);
          const fresh = tmp.querySelector('[data-mtbl]');
          if (fresh) cardEl.appendChild(fresh);
        }
        r.textContent = 'סגירת הפירוט';
      } else {
        if (tbl) tbl.remove();
        r.textContent = 'פירוט לגרם';
      }
    }
  });

  /* ---------- היעדים ---------- */
  /* עוטף: אם progress.js לא נטען משום סיבה, הדף ממשיך לעבוד בלעדיו */
  function exBlockSafe() {
    try { return myExBlock(); } catch (e) { return ''; }
  }

  function progBlock() {
    try { return window.EBProg ? EBProg.block(DATA) : ''; }
    catch (e) { return ''; }
  }

  function goalsBlock(d) {
    var rows = [['המטרה', d.goal], ['מטרה משנית', d.goal2], ['הצלחה ב-3 חודשים', d.success3m]]
      .filter(function (r) { return r[1]; });
    if (!rows.length) return '';
    return '<div class="card" style="margin-bottom:12px">'
      + '<div style="font-size:13px;color:var(--mut);margin-bottom:8px">היעדים שלך</div>'
      + rows.map(function (r) {
          return '<div style="display:flex;gap:10px;padding:6px 0;align-items:baseline">'
            + '<span style="color:var(--mut);font-size:12.5px;min-width:110px">' + esc(r[0]) + '</span>'
            + '<span style="flex:1;font-size:14.5px">' + esc(r[1]) + '</span></div>';
        }).join('')
      + '</div>';
  }

  // קבצים שהמאמן צירף. נפתחים בלשונית חדשה — באייפון זה מעביר
  // לצפיין המובנה, שם אפשר גם לשמור לקבצים או להדפיס.
  function filesBlock(files) {
    if (!files || !files.length) return '';
    var ic = function (n) {
      var e = (String(n).split('.').pop() || '').toLowerCase();
      if (e === 'pdf') return '📄';
      if (['png','jpg','jpeg','webp','heic'].indexOf(e) > -1) return '🖼';
      if (e === 'xlsx') return '📊';
      if (e === 'docx') return '📝';
      return '📎';
    };
    return '<div class="card" style="margin-bottom:12px">'
      + '<div style="font-size:13px;color:var(--mut);margin-bottom:8px">קבצים מהמאמן</div>'
      + files.map(function (f) {
          return '<a href="' + esc(f.url) + '" target="_blank" rel="noopener" '
            + 'style="display:flex;align-items:center;gap:10px;padding:10px 0;color:var(--tx);'
            + 'border-top:1px solid var(--line)">'
            + '<span style="font-size:19px">' + ic(f.name) + '</span>'
            + '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
            + esc(f.name) + '</span>'
            + '<span style="color:var(--or);font-size:13px;white-space:nowrap">פתיחה ›</span></a>';
        }).join('')
      + '</div>';
  }
  function readCache() { try { return JSON.parse(localStorage.getItem(CACHE)); } catch (e) { return null; } }
  function writeCache(d) { try { localStorage.setItem(CACHE, JSON.stringify(d)); } catch (e) {} }

  /* ---------- תצוגה ---------- */
  function paint() {
    $('#hTitle').textContent = DATA.name || 'התוכנית שלי';
    $('#hSub').textContent = [DATA.goal, DATA.trainer_name && 'מאמן: ' + DATA.trainer_name]
      .filter(Boolean).join(' · ');

    const days  = (DATA.program && DATA.program.days) || [];
    const files = DATA.files || [];

    screen(
        openerBlock(days)
      + healthAlert()
      + targetsBlock()
      + progBlock()
      + planBlock(days)
      + nutritionPlan()
      + exBlockSafe()
      + libButton()
      + exButton()
      + filesBlock(files)
      + healthFolder()
      + footerBlock()
    );
    bar();
  }

  /* פתיח: משפט אחד שאומר מה יש כאן. בלעדיו הדף נפתח באמצע עניין
     ולא ברור אם זו התוכנית המלאה או קטע ממנה. */
  function openerBlock(days) {
    const first = (DATA.name || '').trim().split(/\s+/)[0] || '';
    const ex    = days.reduce((a, d) => a + ((d.exercises || []).length), 0);
    const meals = (DATA.meals || []).length;
    const t     = (DATA.program && DATA.program.targets) || null;

    const bits = [];
    if (days.length) bits.push(days.length + ' ימי אימון');
    if (ex)          bits.push(ex + ' תרגילים');
    if (meals)       bits.push(meals + ' ארוחות בתפריט');
    if (t && t.kcal) bits.push('יעד של ' + t.kcal.toLocaleString('en-US') + ' קק״ל ביום');
    if (!bits.length) return '';

    return '<div class="card" style="margin-bottom:12px;background:transparent;border:0;padding:4px 2px 0">'
      + '<div style="font-family:Frank Ruhl Libre,serif;font-weight:700;font-size:19px;line-height:1.35">'
      + (first ? esc(first) + ', זו התוכנית שלך' : 'זו התוכנית שלך') + '</div>'
      + '<div class="mt" style="font-size:13.5px;margin-top:6px;line-height:1.6">'
      + bits.join(' · ') + '.</div></div>';
  }

  /* היעדים המחושבים. מגיעים בתוך התוכנית כי הם נגזרים ממדידות
     שהמאמן לקח, ואין להם מקום משלהם בשליפה. */
  function targetsBlock() {
    const t = (DATA.program && DATA.program.targets) || null;
    if (!t || !t.kcal) return '';
    const n = v => (v == null || v === '') ? null : v;
    const cell = (label, val, unit) => !n(val) ? '' :
      '<div style="flex:1;min-width:74px">'
      + '<div style="font-family:Heebo;font-weight:700;font-size:19px;line-height:1;'
      + 'font-variant-numeric:tabular-nums;color:var(--cop)">' + val
      + (unit ? '<span style="font-size:11px;font-weight:400;color:var(--mut)"> ' + unit + '</span>' : '')
      + '</div><div class="mt" style="font-size:11px;margin-top:3px">' + label + '</div></div>';

    return '<div class="card" style="margin-bottom:12px">'
      + '<div style="font-family:Frank Ruhl Libre,serif;font-weight:700;font-size:15px;margin-bottom:11px">'
      + 'היעדים היומיים שלך</div>'
      + '<div style="display:flex;gap:12px;flex-wrap:wrap">'
      + cell('קלוריות', t.kcal && t.kcal.toLocaleString('en-US'), '')
      + cell('חלבון', t.protein, 'ג׳')
      + cell('פחמימות', t.carbs, 'ג׳')
      + cell('שומן', t.fat, 'ג׳')
      + cell('מים', t.water, 'ליטר')
      + cell('צח״מ', t.vo2, '')
      + '</div></div>';
  }

  /* כל הימים פרושים כתיקיות, ולא רצועת לשוניות שמראה יום אחד. כך
     נראית התוכנית כולה במבט אחד, ואפשר לפתוח את מה שמתאמנים היום. */
  function planBlock(days) {
    if (!days.length) return '';
    let h = '<div style="font-family:Frank Ruhl Libre,serif;font-weight:700;font-size:15px;'
      + 'margin:18px 0 10px">התוכנית השבועית</div>';

    days.forEach((d, i) => {
      const ex   = d.exercises || [];
      const open = DAY === i;
      const done = ex.filter((_, j) => (STATE[i + ':' + j] || {}).done).length;
      const full = ex.length > 0 && done === ex.length;

      h += '<div class="dayc' + (open ? ' on' : '') + (full ? ' full' : '') + '" data-d="' + i + '">'
        + '<button class="dayh" data-day="' + i + '">'
        + '<span class="daynum">' + (i + 1) + '</span>'
        + '<span class="dayt"><span class="dayn">' + esc(d.name || ('יום ' + (i + 1))) + '</span>'
        + '<span class="daym">' + (done ? '<em>' + done + '</em>/' : '') + ex.length + ' תרגילים</span></span>'
        + '<span class="daychev"></span></button>'
        + '<div class="dayb">';

      h += ex.length
        ? ex.map((e, j) => exCard(e, j, i)).join('')
        : '<div class="mt" style="text-align:center;padding:14px;font-size:13.5px">אין תרגילים ליום הזה</div>';

      if (ex.length) {
        h += '<div class="card" style="margin:4px 0 10px;background:var(--ink)">'
          + '<label style="font-size:13px;color:var(--mut)">איך היה?</label>'
          + '<div class="feel">' + ['קל', 'בסדר', 'קשה'].map(f =>
              '<button data-feel="' + f + '"' + (FEEL === f ? ' class="on"' : '') + '>' + f + '</button>'
            ).join('') + '</div>'
          + '<button class="btn" data-fin="' + i + '" style="width:100%;margin-top:10px"'
          + (done ? '' : ' disabled') + '>סיימתי את האימון הזה</button></div>';
      }
      h += '</div></div>';
    });
    return h;
  }


  /* ---------- הצהרת בריאות ----------
     שבע שאלות הסינון מגיעות מ-health.js, אותו מקור שהמאמן קורא ממנו,
     כדי שלא ייווצר מצב ששני הצדדים שואלים שאלות שונות. */
  let HEALTH = null, HFORM = false;

  function hKey() { return 'eb_health_' + (TOKEN || 'x'); }
  function hLoad() {
    if (DATA && DATA.health) return DATA.health;
    try { return JSON.parse(localStorage.getItem(hKey()) || 'null'); } catch (e) { return null; }
  }


  /* ההצהרה יושבת בתיקייה בתחתית, ולא תופסת מקום בתוכנית עצמה.
     היוצא מן הכלל: מי שעדיין לא חתם מקבל שורה אחת דקה למעלה —
     בלי זה הוא פשוט לא ימלא לעולם. */
  let HOPEN = false;

  function healthAlert() {
    if (typeof EBHealth === 'undefined') return '';
    HEALTH = HEALTH || hLoad();
    if (HEALTH && HEALTH.signedAt) return '';
    return '<button onclick="EBT.hJump()" style="width:100%;margin-bottom:12px;cursor:pointer;'
      + 'background:rgba(209,154,85,.10);border:1px solid rgba(209,154,85,.45);border-radius:12px;'
      + 'padding:10px 13px;font-family:inherit;font-size:13px;color:var(--cop);font-weight:600;'
      + 'text-align:right">חסרה הצהרת בריאות — דקה אחת, ואפשר להתחיל</button>';
  }

  function healthFolder() {
    if (typeof EBHealth === 'undefined') return '';
    HEALTH = HEALTH || hLoad();
    const signed = !!(HEALTH && HEALTH.signedAt);
    const sub = signed
      ? 'נחתמה ' + esc(String(HEALTH.signedAt).split('-').reverse().join('.'))
      : 'טרם מולאה';

    return '<div class="dayc' + (HOPEN ? ' on' : '') + '" id="hbox" style="margin-top:12px">'
      + '<button class="dayh" onclick="EBT.hToggle()">'
      + '<span class="daynum" style="font-size:13px">' + (signed ? '✓' : '!') + '</span>'
      + '<span class="dayt"><span class="dayn">הצהרת בריאות</span>'
      + '<span class="daym">' + sub + '</span></span>'
      + '<span class="daychev"></span></button>'
      + '<div class="dayb">' + healthBlock() + '</div></div>';
  }


  /* ---------- אישור רפואי מצולם ----------
     התמונה נדחסת במכשיר ונשמרת עם ההצהרה. אין כאן קריאה אוטומטית
     של הכתוב בצילום: OCR היה מחייב מפתח API על מכשיר המתאמן, והמפתח
     הזה גלוי לכל מי שפותח את הקישור. לכן המערכת מסמנת "התקבל, ממתין
     לאימות", והמאמן מאשר בעין. */

  function healthFiles() {
    var f = (HEALTH && HEALTH.files) || [];
    var h = '<div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line)">'
      + '<div style="font-size:13px;color:var(--mut);line-height:1.6;margin-bottom:9px">'
      + 'יש לך אישור רופא או הצהרה חתומה? צלם או צרף כאן.</div>';

    f.forEach(function (x, i) {
      h += '<div style="display:flex;align-items:center;gap:9px;padding:8px 0;border-top:1px solid var(--line)">'
        + (x.url && x.url.indexOf('image') > -1
            ? '<img src="' + esc(x.url) + '" alt="" style="width:42px;height:42px;object-fit:cover;'
              + 'border-radius:8px;flex:none;background:var(--ink)">'
            : '<span style="width:42px;height:42px;border-radius:8px;flex:none;display:grid;'
              + 'place-items:center;background:var(--ink);font-size:17px">📄</span>')
        + '<div style="flex:1;min-width:0">'
        + '<div style="font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
        + esc(x.name || 'קובץ') + '</div>'
        + '<div class="mt" style="font-size:11.5px">התקבל · ממתין לאימות המאמן</div></div>'
        + '<button onclick="EBT.hFileRm(' + i + ')" style="background:none;border:0;color:var(--dim);'
        + 'font-size:17px;cursor:pointer;padding:0 4px;line-height:1">✕</button></div>';
    });

    return h + '<label class="btn ghost" style="display:block;width:100%;margin-top:8px;'
      + 'font-size:13.5px;text-align:center;cursor:pointer">'
      + (f.length ? 'הוספת קובץ נוסף' : 'צילום או צירוף קובץ')
      + '<input type="file" accept="image/*,.pdf" onchange="EBT.hFile(this)" style="display:none"></label>'
      + '</div>';
  }

  /* דחיסה במכשיר: צילום מטלפון הוא 3-8 מגה, וזה כבד מכדי להישמר
     ברשומה. 1400 פיקסל ברוחב מספיק כדי לקרוא מסמך מצולם. */
  function shrink(file) {
    return new Promise(function (res, rej) {
      if (!/^image\//.test(file.type)) {
        var fr0 = new FileReader();
        fr0.onload = function () { res(fr0.result); };
        fr0.onerror = rej;
        fr0.readAsDataURL(file);
        return;
      }
      var fr = new FileReader();
      fr.onload = function () {
        var img = new Image();
        img.onload = function () {
          var max = 1400, w = img.width, h = img.height;
          if (w > max || h > max) { var r = Math.min(max / w, max / h); w = Math.round(w * r); h = Math.round(h * r); }
          var cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img, 0, 0, w, h);
          res(cv.toDataURL('image/jpeg', 0.72));
        };
        img.onerror = rej;
        img.src = fr.result;
      };
      fr.onerror = rej;
      fr.readAsDataURL(file);
    });
  }

  async function hFile(input) {
    var file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    if (file.size > 12 * 1024 * 1024) { toast('הקובץ גדול מדי (מעל 12 מגה)'); return; }

    toast('מעלה...');
    var url;
    try { url = await shrink(file); }
    catch (e) { toast('לא הצלחתי לקרוא את הקובץ'); return; }

    if (url.length > 1400000) { toast('הקובץ עדיין גדול מדי. נסה צילום קרוב יותר.'); return; }

    HEALTH = HEALTH || { answers: {} };
    HEALTH.files = HEALTH.files || [];
    HEALTH.files.push({ name: file.name || 'צילום', url: url, at: new Date().toISOString().slice(0, 10) });
    try { localStorage.setItem(hKey(), JSON.stringify(HEALTH)); } catch (e) {}
    paint();
    toast('הקובץ התקבל. המאמן יאמת אותו.');
    hPush();
  }

  function hFileRm(i) {
    if (!HEALTH || !HEALTH.files) return;
    HEALTH.files.splice(i, 1);
    try { localStorage.setItem(hKey(), JSON.stringify(HEALTH)); } catch (e) {}
    paint();
    hPush();
  }

  async function hPush() {
    try {
      var r = await sb.rpc('trainee_health', { p_token: TOKEN, p_health: HEALTH });
      if (r.error) throw r.error;
    } catch (e) {
      toast('נשמר במכשיר. יגיע למאמן אחרי שיסיים את ההגדרה.');
    }
  }

  function healthBlock() {
    if (typeof EBHealth === 'undefined') return '';
    HEALTH = HEALTH || hLoad();

    if (HEALTH && HEALTH.signedAt && !HFORM) {
      return '<div style="padding:4px 2px 10px">'
        + '<div style="font-size:13px;color:var(--mut);line-height:1.6">'
        + 'ההצהרה נשלחה למאמן. אם משהו השתנה במצב הבריאותי שלך — '
        + '<a href="#" onclick="EBT.hOpen();return false" style="color:var(--or)">לעדכון</a>.</div>'
        + healthFiles() + '</div>';
    }

    if (!HFORM) {
      return '<div style="padding:4px 2px 10px">'
        + '<div style="font-size:13.5px;color:var(--mut);line-height:1.6;margin-bottom:12px">'
        + 'שבע שאלות, פחות מדקה. זה מה שמאפשר לי לבנות לך תוכנית בטוחה.</div>'
        + '<button class="btn" onclick="EBT.hOpen()" style="font-weight:700">למילוי ההצהרה</button>'
        + healthFiles() + '</div>';
    }

    var h = '<div class="card" style="margin-bottom:12px">'
      + '<div style="font-family:Frank Ruhl Libre,serif;font-weight:700;font-size:16px;margin-bottom:4px">'
      + 'הצהרת בריאות</div>'
      + '<div style="font-size:12.5px;color:var(--mut);line-height:1.6;margin-bottom:12px">'
      + 'ענה בכנות. תשובת כן לא מונעת ממך להתאמן — היא רק אומרת שנצטרך '
      + 'אישור רופא לפני שמתחילים.</div>'
      + (typeof EBPrivacy !== 'undefined' ? EBPrivacy.noticeHTML(true) : '');

    EBHealth.PARQ.forEach(function (q, i) {
      var cur = (HEALTH && HEALTH.answers) ? HEALTH.answers[q.k] : null;
      h += '<div style="padding:11px 0;border-top:1px solid var(--line)">'
        + '<div style="font-size:13.5px;line-height:1.5;margin-bottom:8px">'
        + (i + 1) + '. ' + esc(q.q) + '</div>'
        + '<div style="display:flex;gap:8px">'
        + hBtn(q.k, 'no', 'לא', cur === 'no')
        + hBtn(q.k, 'yes', 'כן', cur === 'yes')
        + '</div></div>';
    });

    h += '<div style="padding:12px 0 0;border-top:1px solid var(--line)">'
      + '<div style="font-size:13px;color:var(--mut);margin-bottom:6px">'
      + 'משהו נוסף שכדאי שאדע? (לא חובה)</div>'
      + '<textarea id="h_notes" rows="2" style="width:100%;background:var(--ink);color:var(--tx);'
      + 'border:1px solid var(--line);border-radius:10px;padding:9px;font-family:inherit;font-size:13px" '
      + 'placeholder="פציעות, תרופות, כל דבר רלוונטי">' + esc((HEALTH && HEALTH.notes) || '') + '</textarea></div>'

      + '<div style="padding:12px 0 0">'
      + '<div style="font-size:13px;color:var(--mut);margin-bottom:6px">שם מלא כחתימה</div>'
      + '<input id="h_sign" value="' + esc((HEALTH && HEALTH.signature) || (DATA && DATA.name) || '') + '" '
      + 'style="width:100%;background:var(--ink);color:var(--tx);border:1px solid var(--line);'
      + 'border-radius:10px;padding:9px;font-family:inherit;font-size:14px"></div>'

      + '<div style="font-size:11.5px;color:var(--dim);line-height:1.6;margin:12px 0">'
      + 'ההצהרה אינה מחליפה בדיקה או ייעוץ רפואי.</div>'
      + (typeof EBPrivacy !== 'undefined' ? EBPrivacy.consentHTML('h_consent') : '')
      + '<div style="height:10px"></div>'

      + '<div style="display:flex;gap:8px">'
      + '<button class="btn" onclick="EBT.hSave()" style="font-weight:700">שליחה</button>'
      + '<button class="btn ghost" onclick="EBT.hCancel()">ביטול</button></div>'
      + healthFiles()
      + '</div>';
    return h;
  }

  function hBtn(k, val, label, on) {
    var bg = on ? (val === 'yes' ? 'rgba(217,96,90,.18)' : 'rgba(143,168,79,.18)') : 'var(--ink)';
    var fg = on ? (val === 'yes' ? '#D9605A' : 'var(--or)') : 'var(--mut)';
    var bd = on ? (val === 'yes' ? '#D9605A66' : 'rgba(143,168,79,.5)') : 'var(--line)';
    return '<button onclick="EBT.hPick(\'' + k + '\',\'' + val + '\')" '
      + 'style="flex:1;padding:9px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13.5px;'
      + 'font-weight:' + (on ? '800' : '400') + ';background:' + bg + ';color:' + fg + ';border:1px solid ' + bd + '">'
      + label + '</button>';
  }

  function hOpen() { HFORM = true; HEALTH = HEALTH || { answers: {} }; paint(); }
  function hCancel() { HFORM = false; paint(); }

  function hPick(k, v) {
    HEALTH = HEALTH || { answers: {} };
    HEALTH.answers = HEALTH.answers || {};
    HEALTH.answers[k] = v;
    hKeepText();
    paint();
  }

  /* שומר את מה שהוקלד לפני ציור מחדש — אחרת ההערות והחתימה נמחקות
     בכל לחיצה על כן/לא. */
  function hKeepText() {
    var n = document.getElementById('h_notes'), g = document.getElementById('h_sign');
    if (n) HEALTH.notes = n.value;
    if (g) HEALTH.signature = g.value;
  }

  async function hSave() {
    hKeepText();
    var miss = EBHealth.PARQ.filter(function (q) { return !HEALTH.answers || !HEALTH.answers[q.k]; });
    if (miss.length) { toast('נשארו ' + miss.length + ' שאלות ללא תשובה'); return; }
    if (!String(HEALTH.signature || '').trim()) { toast('חסרה חתימה'); return; }
    /* בלי הסכמה מתועדת אין בסיס חוקי לאיסוף מידע רפואי, ולכן זו
       חסימה ולא אזהרה. */
    var cb = document.getElementById('h_consent');
    if (typeof EBPrivacy !== 'undefined' && cb && !cb.checked) {
      toast('צריך לאשר את ההסכמה כדי לשלוח'); return;
    }
    if (typeof EBPrivacy !== 'undefined') HEALTH.consent = EBPrivacy.consentRecord();

    HEALTH.signedAt = new Date().toISOString().slice(0, 10);
    try { localStorage.setItem(hKey(), JSON.stringify(HEALTH)); } catch (e) {}
    HFORM = false;
    paint();

    var anyYes = EBHealth.PARQ.some(function (q) { return HEALTH.answers[q.k] === 'yes'; });
    toast(anyYes ? 'נשלח. נצטרך אישור רופא לפני שמתחילים.' : 'ההצהרה נשלחה, תודה.');

    try {
      var r = await sb.rpc('trainee_health', { p_token: TOKEN, p_health: HEALTH });
      if (r.error) throw r.error;
    } catch (e) {
      /* בלי הפונקציה בשרת ההצהרה נשמרת במכשיר. המתאמן סיים את שלו,
         ולכן הודעה אחת ולא כישלון. */
      toast('נשמר במכשיר. יגיע למאמן אחרי שיסיים את ההגדרה.');
    }
  }

  window.EBT = Object.assign(window.EBT || {},
    { hOpen: hOpen, hCancel: hCancel, hPick: hPick, hSave: hSave,
      hToggle: function () { HOPEN = !HOPEN; paint(); },
      hJump: function () {
        HOPEN = true; HFORM = true; HEALTH = HEALTH || { answers: {} }; paint();
        var b = document.getElementById('hbox');
        if (b) b.scrollIntoView({ behavior: 'smooth', block: 'start' });
      },
      hFile: hFile, hFileRm: hFileRm });


  /* ---------- תוכנית התזונה ----------
     קודם היו כאן שני בלוקים נפרדים: התפריט שהמאמן בנה, ומתחתיו רשימה
     של מה שהמתאמן הוסיף לעצמו. זה תיאר את מבנה הנתונים ולא את מה
     שהמתאמן צריך — הוא רוצה לדעת מה לאכול בבוקר, לא מי הזין את זה.

     עכשיו הכל תוכנית אחת, באותו מבנה תיקיות כמו תוכנית האימון:
     כל ארוחה ביום פותחת ונסגרת, ומה שהמתאמן הוסיף מסומן בתוכה. */

  var SLOT_ORDER = ['breakfast', 'snack', 'pre', 'lunch', 'post', 'dinner', 'other'];
  var SLOT_HE = { breakfast:'בוקר', snack:'ביניים', pre:'לפני אימון',
                  post:'אחרי אימון', lunch:'צהריים', dinner:'ערב', other:'נוספות' };
  let SLOT = 0;

  function nz(v) { var x = Number(v); return isFinite(x) && x > 0 ? x : 0; }

  /* אוסף את כל הארוחות לתאים, משני המקורות */
  function slots() {
    var by = {};
    SLOT_ORDER.forEach(function (k) { by[k] = []; });

    (DATA.meals || []).forEach(function (m) {
      var k = SLOT_HE[m.type] ? m.type : 'other';
      by[k].push({
        name: m.name || 'ארוחה', desc: m.desc || '', photo: m.photo || '',
        k: nz(m.kcal), p: nz(m.protein), c: nz(m.carbs), f: nz(m.fat), mine: false
      });
    });

    if (typeof EBLib !== 'undefined') {
      (MY_MEALS || []).forEach(function (x) {
        if (x.custom) {
          by.other.push({ name: x.name, desc: 'בניתי בעצמי', mine: true, key: x.name,
                          k: nz(x.k), p: nz(x.p), c: nz(x.c), f: nz(x.f) });
          return;
        }
        var m = EBLib.byId(x.libId);
        if (!m) return;
        var t = EBLib.calc(m.items).total;
        var k = SLOT_HE[m.type] ? m.type : 'other';
        by[k].push({ name: m.name, desc: (m.items || []).join(', '), mine: true, key: m.id,
                     k: nz(t.k), p: nz(t.p), c: nz(t.c), f: nz(t.f) });
      });
    }
    return by;
  }

  function nutritionPlan() {
    var by = slots();
    var any = SLOT_ORDER.some(function (k) { return by[k].length; });
    var lib = (typeof EBLib !== 'undefined');
    if (!any && !lib) return '';

    /* סיכום היום מול היעדים */
    var tot = { k:0, p:0, c:0, f:0 }, cnt = 0;
    SLOT_ORDER.forEach(function (s) {
      by[s].forEach(function (m) { tot.k += m.k; tot.p += m.p; tot.c += m.c; tot.f += m.f; cnt++; });
    });
    var tg = (DATA.program && DATA.program.targets) || {};

    var h = '<div style="font-family:Frank Ruhl Libre,serif;font-weight:700;font-size:15px;'
      + 'margin:18px 0 10px">תוכנית התזונה</div>';

    if (cnt) {
      h += '<div class="card" style="margin-bottom:12px">'
        + '<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px">'
        + macro('קק״ל', Math.round(tot.k), tg.kcal)
        + macro('חלבון', Math.round(tot.p), tg.protein)
        + macro('פחמימות', Math.round(tot.c), tg.carbs)
        + macro('שומן', Math.round(tot.f), tg.fat)
        + '</div>'
        + '<div class="mt" style="font-size:11.5px;margin-top:8px">'
        + cnt + ' ארוחות בתוכנית</div></div>';
    }

    SLOT_ORDER.forEach(function (key, i) {
      var g = by[key];
      /* תא ריק מוצג רק אם אפשר להוסיף אליו — אחרת הוא רק רעש */
      if (!g.length && (!lib || key === 'other')) return;
      var open = SLOT === i;
      var sk = g.reduce(function (a, m) { return a + m.k; }, 0);

      h += '<div class="dayc' + (open ? ' on' : '') + '">'
        + '<button class="dayh" data-slot="' + i + '">'
        + '<span class="daynum" style="font-size:11px">' + esc(SLOT_HE[key].slice(0, 4)) + '</span>'
        + '<span class="dayt"><span class="dayn">' + esc(SLOT_HE[key]) + '</span>'
        + '<span class="daym">' + (g.length ? g.length + ' ארוחות · ' + Math.round(sk) + ' קק״ל' : 'ריק')
        + '</span></span><span class="daychev"></span></button>'
        + '<div class="dayb">';

      g.forEach(function (m) {
        h += '<div class="card" style="padding:0;overflow:hidden;margin:0 0 8px">'
          + (m.photo ? '<img src="' + esc(m.photo) + '" alt="" loading="lazy" '
              + 'style="width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--ink)">' : '')
          + '<div style="padding:12px">'
          + '<div style="display:flex;align-items:flex-start;gap:8px">'
          + '<div style="flex:1;min-width:0">'
          + '<div style="font-family:Heebo;font-weight:700;font-size:15px;line-height:1.3">'
          + esc(m.name)
          + (m.mine ? '<span style="font-size:10.5px;font-weight:700;color:var(--or);'
              + 'background:rgba(143,168,79,.15);border-radius:20px;padding:2px 7px;margin-right:6px">שלי</span>' : '')
          + '</div>'
          + (m.desc ? '<div style="color:var(--mut);font-size:13px;margin-top:4px;line-height:1.5;'
              + 'white-space:pre-wrap">' + esc(m.desc) + '</div>' : '')
          + '</div>'
          + (m.mine ? '<button data-myrm="' + esc(m.key) + '" style="background:none;border:0;'
              + 'color:var(--dim);font-size:17px;cursor:pointer;padding:0 4px;line-height:1">✕</button>' : '')
          + '</div>'
          + (m.k || m.p || m.c || m.f
              ? '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:9px">'
                + (m.k ? tag(Math.round(m.k) + ' קק״ל', 1) : '')
                + (m.p ? tag('חלבון ' + Math.round(m.p)) : '')
                + (m.c ? tag('פחמימות ' + Math.round(m.c)) : '')
                + (m.f ? tag('שומן ' + Math.round(m.f)) : '')
                + '</div>' : '')
          + '</div></div>';
      });

      if (!g.length) {
        h += '<div class="mt" style="text-align:center;padding:10px;font-size:13px">'
          + 'עוד אין כאן ארוחה</div>';
      }
      if (lib) {
        h += '<button class="btn ghost" style="width:100%;margin:4px 0 8px;font-size:13.5px" '
          + 'onclick="__libOpen(\'' + key + '\')">הוספת ארוחה ל' + esc(SLOT_HE[key]) + '</button>';
      }
      h += '</div></div>';
    });

    return h;
  }

  /* ערך מול יעד — בלי יעד מוצג המספר בלבד */
  function macro(label, val, target) {
    var t = Number(target);
    var pctTxt = (isFinite(t) && t > 0) ? ' <span class="mt" style="font-size:11.5px">/ ' + Math.round(t) + '</span>' : '';
    return '<span><b style="font-family:Heebo;color:var(--or)">' + val + '</b>' + pctTxt
      + ' <span class="mt">' + label + '</span></span>';
  }

  function footerBlock() {
    if (!localStorage.getItem('ebfit_t_token')) return '';
    return '<div style="text-align:center;margin:22px 0 6px">'
      + '<button class="btn ghost" style="font-size:13px;padding:8px 18px" '
      + 'onclick="__ebLogout()">יציאה</button></div>';
  }

  function exCard(e, i, dayIdx) {
    const d  = (dayIdx == null ? DAY : dayIdx);
    const st = STATE[d + ':' + i] || {};
    const meta = [e.sets && e.sets + ' סטים', e.reps && e.reps + ' חזרות',
                  e.rest && 'מנוחה ' + e.rest + 'שנ'].filter(Boolean).join(' · ');
    return '<div class="ex' + (st.done ? ' done' : '') + '" data-ex="' + i + '" data-exd="' + d + '">'
      + '<div class="hd"><button class="chk" data-chk="' + i + '" data-chkd="' + d + '">✓</button>'
      + '<div style="flex:1;min-width:0"><div class="nm">' + esc(e.name || 'תרגיל') + '</div>'
      + (meta ? '<div class="meta">' + esc(meta) + '</div>' : '')
      + (e.note ? '<div class="note">' + esc(e.note) + '</div>' : '')
      + '</div></div>'
      + '<div class="logs">'
      + '<input data-f="weight" data-i="' + i + '" data-d="' + d + '" inputmode="decimal" placeholder="משקל" value="' + esc(st.weight != null ? st.weight : (e.weight || '')) + '">'
      + '<input data-f="reps" data-i="' + i + '" data-d="' + d + '" inputmode="numeric" placeholder="חזרות" value="' + esc(st.reps != null ? st.reps : '') + '">'
      + '</div></div>';
  }

  /* הסרגל מסכם את כל השבוע. כפתור השליחה עבר לתוך היום עצמו — עם כל
     הימים פרושים, כפתור אחד למטה לא היה יודע איזה יום התכוונת לשדר. */
  function bar() {
    const days = (DATA.program && DATA.program.days) || [];
    let tot = 0, done = 0;
    days.forEach((d, i) => {
      const ex = d.exercises || [];
      tot += ex.length;
      done += ex.filter((_, j) => (STATE[i + ':' + j] || {}).done).length;
    });
    let b = document.querySelector('.bar');
    if (!tot) { if (b) b.remove(); return; }
    if (!b) { b = document.createElement('div'); b.className = 'bar'; document.body.appendChild(b); }
    const pct = Math.round(done / tot * 100);
    b.innerHTML =
        '<div class="prog"><b>' + done + '</b> מתוך <b>' + tot + '</b> תרגילים השבוע</div>'
      + '<div style="flex:none;width:74px;height:5px;border-radius:20px;background:var(--card);overflow:hidden">'
      + '<div style="height:100%;width:' + pct + '%;border-radius:20px;background:var(--or)"></div></div>'
      + '<b style="font-family:Heebo;font-size:14px;min-width:34px;text-align:left">' + pct + '%</b>';
  }

  /* ---------- אינטראקציה ---------- */
  document.addEventListener('click', e => {
    /* פתיחה וסגירה במקום, בלי ציור מחדש — ציור מלא מחזיר את הגלילה
       לראש הדף, ומי שפתח את יום ד' נזרק חזרה ליום א'. */
    const day = e.target.closest('[data-day]');
    if (day) {
      const card = day.closest('.dayc');
      const i = +day.dataset.day;
      const wasOpen = card.classList.contains('on');
      document.querySelectorAll('.dayc.on').forEach(c => c.classList.remove('on'));
      if (!wasOpen) { card.classList.add('on'); DAY = i; }
      bar();
      return;
    }

    const chk = e.target.closest('[data-chk]');
    if (chk) {
      const d = chk.dataset.chkd != null ? chk.dataset.chkd : DAY;
      const k = d + ':' + chk.dataset.chk;
      STATE[k] = STATE[k] || {};
      STATE[k].done = !STATE[k].done;
      chk.closest('.ex').classList.toggle('done', STATE[k].done);
      dayMeta(+d);
      bar();
      return;
    }

    const fl = e.target.closest('[data-feel]');
    if (fl) {
      FEEL = FEEL === fl.dataset.feel ? null : fl.dataset.feel;
      document.querySelectorAll('[data-feel]').forEach(b =>
        b.classList.toggle('on', b.dataset.feel === FEEL));
      return;
    }

    const pg = e.target.closest('[data-pg]');
    if (pg) {
      if (pg.dataset.pg === 'save') {
        const inp = document.getElementById('pg_w');
        const v = inp ? inp.value : '';
        if (!String(v).trim()) { toast('הזן משקל'); if (inp) inp.focus(); return; }
        if (!EBProg.add(v)) { toast('משקל לא תקין'); if (inp) inp.select(); return; }
        toast('נרשם ✓'); paint();
      } else if (pg.dataset.pg === 'edit') {
        EBProg.clearToday(); paint();
        const inp = document.getElementById('pg_w'); if (inp) inp.focus();
      }
      return;
    }

    const fin = e.target.closest('[data-fin]');
    if (fin) { finish(+fin.dataset.fin, fin); return; }

    if (e.target.id === 'finish') finish(DAY);
  });

  document.addEventListener('input', e => {
    /* עדכון הסיכום בלבד. ציור מחדש בכל הקלדה היה מוציא את הסמן
       מהשדה אחרי כל ספרה. */
    const bg = e.target.dataset && e.target.dataset.bg;
    if (bg != null) {
      const i = +bg;
      if (BUILD[i]) { BUILD[i].g = e.target.value; writeBuild(); refreshTot(); }
      return;
    }
    const f = e.target.dataset && e.target.dataset.f;
    if (!f) return;
    const d = e.target.dataset.d != null ? e.target.dataset.d : DAY;
    const k = d + ':' + e.target.dataset.i;
    STATE[k] = STATE[k] || {};
    STATE[k][f] = e.target.value;
  });

  /* ---------- שליחת דיווח ---------- */
  async function finish(dayIdx, btn) {
    const i = (dayIdx == null ? DAY : dayIdx);
    btn = btn || $('#finish');
    if (btn) { btn.disabled = true; btn.textContent = 'שולח…'; }
    const day = (DATA.program.days || [])[i] || {};
    const entries = (day.exercises || []).map((e, j) => {
      const st = STATE[i + ':' + j] || {};
      return { ex: e.name || '', done: !!st.done, weight: st.weight || '', reps: st.reps || '' };
    });
    try {
      const { error } = await sb.rpc('trainee_log', {
        p_token: TOKEN, p_day_index: i,
        p_day_name: day.name || ('יום ' + (i + 1)),
        p_entries: entries, p_feel: FEEL, p_note: null
      });
      if (error) throw error;
      toast('נשלח למאמן. כל הכבוד! 💪');
      if (window.EBProg) EBProg.logWorkout();
      /* מנקים רק את היום ששודר. מי שסימן מראש תרגילים ביום אחר
         לא אמור לאבד אותם רק כי סיים אימון. */
      Object.keys(STATE).forEach(k => { if (k.indexOf(i + ':') === 0) delete STATE[k]; });
      FEEL = null; paint();
    } catch (err) {
      toast('לא הצלחנו לשלוח — נסה שוב כשתהיה רשת');
      if (btn) { btn.disabled = false; btn.textContent = 'סיימתי את האימון הזה'; }
    }
  }

  /* מונה התרגילים בכותרת היום, בלי לצייר מחדש */
  function dayMeta(i) {
    const card = document.querySelector('.dayc[data-d="' + i + '"]');
    if (!card) return;
    const ex = ((DATA.program.days || [])[i] || {}).exercises || [];
    const done = ex.filter((_, j) => (STATE[i + ':' + j] || {}).done).length;
    const meta = card.querySelector('.daym');
    if (meta) meta.innerHTML = (done ? '<em>' + done + '</em>/' : '') + ex.length + ' תרגילים';
    card.classList.toggle('full', ex.length > 0 && done === ex.length);
    const fin = card.querySelector('[data-fin]');
    if (fin) fin.disabled = !done;
  }

  boot();
})();
</script>
</body>
</html>
